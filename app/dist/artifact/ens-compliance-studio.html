de detección de código dañino permanecerán permanentemente actualizadas.v\n– [op.exp.6.5] El software de detección de código dañino instalado en los puestos de usuario deberá estar configurado de forma adecuada e implementará protección en tiempo real de acuerdo a las recomendaciones del fabricante.","refuerzosTexto":"R1-Escaneo periódico.\n– [op.exp.6.r1.1] Todo el sistema se escaneará regularmente para detectar código dañino.\n\nR2-Revisión preventiva del sistema.\n– [op.exp.6.r2.1] Las funciones críticas se analizarán al arrancar el sistema en prevención de modificaciones no autorizadas.\n\nR3 - Lista blanca.\n– [op.exp.6.r3.1] Solamente se podrán ejecutar aquellas aplicaciones previamente autorizadas. Se implementará una lista blanca para impedir la ejecución de aplicaciones no autorizadas.\n\nR4-Capacidad de respuesta en caso de incidente.\n– [op.exp.6.r4.1] Se emplearán herramientas de seguridad orientadas a detectar, investigar y resolver actividades sospechosas en puestos de usuario y servidores (EDR - Endpoint Detection and Response).","iso27001":"8.7 Protección contra malware; 8.19 Instalación de software; 8.16 Monitorización","guias":"CCN-STIC 804/808, 817, 5xx/6xx"},"op.exp.7":{"nombre":"Gestión de incidentes","dims":"Categoría","bajo":"aplica","medio":"+ R1 + R2","alto":"+ R1 + R2 + R3","texto":"– [op.exp.7.1] Se dispondrá de un proceso integral para hacer frente a los incidentes que puedan tener un impacto en la seguridad del sistema, que incluya el informe de eventos de seguridad y debilidades, detallando los criterios de clasificación y el escalado de la notificación.\n– [op.exp.7.2] La gestión de incidentes que afecten a datos personales tendrá en cuenta lo dispuesto en el Reglamento General de Protección de Datos; la Ley Orgánica 3/2018, de 5 de diciembre, en especial su disposición adicional primera, así como el resto de normativa de aplicación, sin perjuicio de los requisitos establecidos en este real decreto.","refuerzosTexto":"R1-Notificación.\n– [op.exp.7.r1.1] Se dispondrá de soluciones de ventanilla única para la notificación de incidentes al CCN-CERT, que permita la distribución de notificaciones a las diferentes entidades de manera federada, utilizando para ello dependencias administrativas jerárquicas.\n\nR2 –Detección y Respuesta.\nEl proceso integral para hacer frente a los incidentes que puedan tener un impacto en la seguridad del sistema ([op.exp.7.1]) deberá incluir:\n– [op.exp.7.r2.1] Implantación de medidas urgentes, incluyendo la detención de servicios, el aislamiento del sistema afectado, la recogida de evidencias y protección de los registros, según convenga al caso.\n– [op.exp.7.r2.2] Asignación de recursos para investigar las causas, analizar las consecuencias y resolver el incidente.\n– [op.exp.7.r2.3] Informar del incidente a los responsables de la información y servicios afectados y de las actuaciones llevadas a cabo para su resolución.\n– [op.exp.7.r2.4] Medidas para:\na) Prevenir que se repita el incidente.\nb) Incluir en los procedimientos de usuario la identificación y forma de tratar el incidente.\nc) Actualizar, extender, mejorar u optimizar los procedimientos de resolución de incidentes.\n\nR3-Reconfiguración dinámica.\nLa reconfiguración dinámica del sistema persigue detener, desviar o limitar ataques, acotando los daños.\n– [op.exp.7.r3.1] La reconfiguración dinámica incluye, por ejemplo, cambios en las reglas de los enrutadores (routers), listas de control de acceso, parámetros del sistema de detección / prevención de intrusiones y reglas en los cortafuegos y puertas de enlace, aislamiento de elementos críticos y aislamiento de las copias de seguridad.\n– [op.exp.7.r3.2] El organismo adaptará los procedimientos de reconfiguración dinámica reaccionando a los anuncios recibidos del CCN-CERT relativos a ciberamenazas sofisticadas y campañas de ataques.","iso27001":"5.24 Planificación gestión incidentes; 5.25 Evaluación de eventos; 5.26 Respuesta; 5.27 Aprender de incidentes; 5.28 Recogida de evidencias; 6.8 Notificación de eventos","guias":"CCN-STIC 804/808, 817, 5xx/6xx"},"op.exp.8":{"nombre":"Registro de la actividad","dims":"T","bajo":"aplica","medio":"+ R1 + R2 + R3 + R4","alto":"+ R1 + R2 + R3 + R4 + R5","texto":"Se registrarán las actividades en el sistema, de forma que:\n– [op.exp.8.1] Se generará un registro de auditoría, que incluirá, al menos, el identificador del usuario o entidad asociado al evento, fecha y hora, sobre qué información se realiza el evento, tipo de evento y el resultado del evento (fallo o éxito), según la política de seguridad y los procedimientos asociados a la misma.\n– [op.exp.8.2] Se activarán los registros de actividad en los servidores.","refuerzosTexto":"R1-Revisión de los registros.\n– [op.exp.8.r1.1] Se revisarán informalmente, de forma periódica, los registros de actividad, buscando patrones anormales.\n\nR2-Sincronización del reloj del sistema.\n– [op.exp.8.r2.1] El sistema deberá disponer de una referencia de tiempo (timestamp) para facilitar las funciones de registro de eventos y auditoría. La modificación de la referencia de tiempo del sistema será una función de administración y, en caso de realizarse su sincronización con otros dispositivos, deberán utilizarse mecanismos de autenticación e integridad.\n\nR3-Retención de registros.\n– [op.exp.8.r3.1] En la documentación de seguridad del sistema se deberán indicar los eventos de seguridad que serán auditados y el tiempo de retención de los registros antes de ser eliminados.\n\nR4-Control de acceso.\n– [op.exp.8.r4.1] Los registros de actividad y, en su caso, las copias de seguridad de los mismos, solamente podrán ser accedidos o eliminarse por personal debidamente autorizado.\n\nR5-Revisión automática y correlación de eventos.\n– [op.exp.8.r5.1] El sistema deberá implementar herramientas para analizar y revisar la actividad del sistema y la información de auditoría, en búsqueda de comprometimientos de la seguridad posibles o reales.\n– [op.exp.8.r5.2] Se dispondrá de un sistema automático de recolección de registros, correlación de eventos y respuesta automática ante los mismos.","iso27001":"8.15 Registro de eventos; 8.17 Sincronización de relojes; 8.16 Monitorización","guias":"CCN-STIC 804/808, 817, 5xx/6xx"},"op.exp.9":{"nombre":"Registro de la gestión de incidentes","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"Se registrarán todas las actuaciones relacionadas con la gestión de incidentes, de forma que:\n– [op.exp.9.1] Se registrarán los reportes iniciales, intermedios y finales de los incidentes, las actuaciones de emergencia y las modificaciones del sistema derivadas del incidente.\n– [op.exp.9.2] Se registrará aquella evidencia que pueda dirimirse en un ámbito jurisdiccional, especialmente cuando el incidente pueda comportar acciones disciplinarias sobre el personal interno, sobre proveedores externos o en la persecución de delitos. En la determinación de la composición y detalle de estas evidencias, se recurrirá a asesoramiento legal especializado.\n– [op.exp.9.3] Como consecuencia del análisis de los incidentes, se revisará la determinación de los eventos auditables.","refuerzosTexto":"","iso27001":"5.26 Respuesta a incidentes; 5.27 Aprender de incidentes; 5.28 Recogida de evidencias","guias":"CCN-STIC 804/808, 817, 5xx/6xx"},"op.exp.10":{"nombre":"Protección de claves criptográficas","dims":"Categoría","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"– [op.exp.10.1] Las claves criptográficas se protegerán durante todo su ciclo de vida: (1) generación, (2) transporte al punto de explotación, (3) custodia durante la explotación, (4) archivo posterior a su retirada de explotación activa y (5) destrucción final.\n– [op.exp.10.2] Los medios de generación estarán aislados de los medios de explotación.\n– [op.exp.10.3] Las claves retiradas de operación que deban ser archivadas, lo serán en medios aislados de los de explotación.","refuerzosTexto":"R1-Algoritmos autorizados.\n– [op.exp.10.r1.1] Se emplearán algoritmos y parámetros autorizados por el CCN.","iso27001":"8.24 Uso de criptografía; 5.17 Información de autenticación","guias":"CCN-STIC 804/808, 817, 5xx/6xx"},"op.ext.1":{"nombre":"Contratación y acuerdos de nivel de servicio","dims":"Categoría","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"– [op.ext.1.1] Con anterioridad a la efectiva utilización de los recursos externos se establecerá contractualmente un Acuerdo de Nivel de Servicio, que incluirá las características del servicio prestado, lo que debe entenderse como «servicio mínimo admisible», así como, la responsabilidad del prestador y las consecuencias de eventuales incumplimientos.","refuerzosTexto":"","iso27001":"5.19 Seguridad en relaciones con proveedores; 5.20 Seguridad en acuerdos con proveedores; 6.6 Acuerdos de confidencialidad; 5.14 Transferencia de información","guias":"CCN-STIC 811, 830, 804/808"},"op.ext.2":{"nombre":"Gestión diaria","dims":"Categoría","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"Se establecerá lo siguiente:\n– [op.ext.2.1] Un sistema rutinario para medir el cumplimiento de las obligaciones de servicio, incluyendo el procedimiento para neutralizar cualquier desviación fuera del margen de tolerancia acordado ([op.ext.1]).\n– [op.ext.2.2] El mecanismo y los procedimientos de coordinación para llevar a cabo las tareas de mantenimiento de los sistemas comprendidos en el acuerdo, que contemplarán los supuestos de incidentes y desastres (ver [op.exp.7]).","refuerzosTexto":"","iso27001":"5.22 Seguimiento, revisión y gestión de cambios de servicios de proveedores","guias":"CCN-STIC 811, 830, 804/808"},"op.ext.3":{"nombre":"Protección de la cadena de suministro","dims":"Categoría","bajo":"n.a.","medio":"n.a.","alto":"aplica","texto":"– [op.ext.3.1] Se analizará el impacto que puede tener sobre el sistema un incidente accidental o deliberado que tenga su origen en la cadena de suministro.\n– [op.ext.3.2] Se estimará el riesgo sobre el sistema por causa del impacto estimado en el punto anterior.\n– [op.ext.3.3] Se tomarán medidas de contención de los impactos estimados en los puntos anteriores.","refuerzosTexto":"","iso27001":"5.21 Seguridad en la cadena de suministro TIC; 5.29 Seguridad durante la disrupción; 5.30 Preparación de las TIC para la continuidad","guias":"CCN-STIC 811, 830, 804/808"},"op.ext.4":{"nombre":"Interconexión de sistemas","dims":"Categoría","bajo":"n.a.","medio":"aplica","alto":"+ R1","texto":"Se denomina interconexión al establecimiento de enlaces con otros sistemas de información para el intercambio de información y servicios.\n– [op.ext.4.1] Todos los intercambios de información y prestación de servicios con otros sistemas deberán ser objeto de una autorización previa. Todo flujo de información estará prohibido salvo autorización expresa.\n– [op.ext.4.2] Para cada interconexión se documentará explícitamente: las características de la interfaz, los requisitos de seguridad y protección de datos y la naturaleza de la información intercambiada.","refuerzosTexto":"R1-Coordinación de actividades.\n– [op.ext.4.r1.1] Cuando se interconecten sistemas en los que la identificación, autenticación y autorización tengan lugar en diferentes dominios de seguridad, bajo distintas responsabilidades, las medidas de seguridad locales se acompañarán de los correspondientes mecanismos y procedimientos de coordinación para la atribución y ejercicio efectivos de las responsabilidades de cada sistema.","iso27001":"8.20 Seguridad de redes; 8.21 Seguridad de servicios de red; 8.22 Segregación de redes; 5.14 Transferencia de información","guias":"CCN-STIC 811, 830, 804/808"},"op.nub.1":{"nombre":"Protección de servicios en la nube","dims":"Categoría","bajo":"aplica","medio":"+ R1","alto":"+ R1 + R2","texto":"– [op.nub.1.1] Los sistemas que suministran un servicio en la nube a organismos del sector público deberán cumplir con el conjunto de medidas de seguridad en función del modelo de servicio en la nube que presten: Software como Servicio (Software as a Service, SaaS), Plataforma como Servicio (Platform as a Service, PaaS) e Infraestructura como Servicio (Infrastructure as a Service, IaaS) definidas en las guías CCN-STIC que sean de aplicación.\n– [op.nub.1.2] Cuando se utilicen servicios en la nube suministrados por terceros, los sistemas de información que los soportan deberán ser conformes con el ENS o cumplir con las medidas desarrolladas en una guía CCN-STIC que incluirá, entre otros, requisitos relativos a:\na) Auditoría de pruebas de penetración (pentesting).\nb) Transparencia.\nc) Cifrado y gestión de claves.\nd) Jurisdicción de los datos.","refuerzosTexto":"R1- Servicios certificados.\n– [op.nub.1.r1.1] Cuando se utilicen servicios en la nube suministrados por terceros, estos deberán estar certificados bajo una metodología de certificación reconocida por el Organismo de Certificación del Esquema Nacional de Evaluación y Certificación de Seguridad de las Tecnologías de la Información.\n– [op.nub.1.r1.2] Si el servicio en la nube es un servicio de seguridad deberá cumplir con los requisitos establecidos en [op.pl.5].\n\nR2-Guías de Configuración de Seguridad Específicas.\n– [op.nub.1.r2.1] La configuración de seguridad de los sistemas que proporcionan estos servicios deberá realizarse según la correspondiente guía CCN-STIC de Configuración de Seguridad Específica, orientadas tanto al usuario como al proveedor.","iso27001":"5.23 Seguridad para el uso de servicios en la nube; 5.19/5.20 Proveedores","guias":"CCN-STIC 810, 823, 884, 804/808"},"op.cont.1":{"nombre":"Análisis de impacto","dims":"D","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"– [op.cont.1.1] Se realizará un análisis de impacto que permita determinar los requisitos de disponibilidad de cada servicio (impacto de una interrupción durante un periodo de tiempo determinado), así como los elementos que son críticos para la prestación de cada servicio.","refuerzosTexto":"","iso27001":"5.29 Seguridad durante la disrupción; 5.30 Preparación de las TIC para la continuidad (BIA – ISO 22301)","guias":"CCN-STIC 804/808; ISO 22301"},"op.cont.2":{"nombre":"Plan de continuidad","dims":"D","bajo":"n.a.","medio":"n.a.","alto":"aplica","texto":"Se desarrollará un plan de continuidad que establezca las acciones a ejecutar en caso de interrupción de los servicios prestados con los medios habituales. Dicho plan contemplará los siguientes aspectos:\n– [op.cont.2.1] Se identificarán funciones, responsabilidades y actividades a realizar.\n– [op.cont.2.2] Existirá una previsión para coordinar la entrada en servicio de los medios alternativos de forma que se garantice poder seguir prestando los servicios esenciales de la organización.\n– [op.cont.2.3] Todos los medios alternativos estarán planificados y materializados en acuerdos o contratos con los proveedores correspondientes.\n– [op.cont.2.4] Las personas afectadas por el plan recibirán formación específica relativa a su papel en dicho plan.\n– [op.cont.2.5] El plan de continuidad será parte integral y armónica de los planes de continuidad de la organización en otras materias ajenas a la seguridad.","refuerzosTexto":"","iso27001":"5.29 Seguridad durante la disrupción; 5.30 Preparación TIC continuidad","guias":"CCN-STIC 804/808; ISO 22301"},"op.cont.3":{"nombre":"Pruebas periódicas","dims":"D","bajo":"n.a.","medio":"n.a.","alto":"aplica","texto":"– [op.cont.3.1] Se realizarán pruebas periódicas para localizar y, en su caso, corregir los errores o deficiencias que puedan existir en el plan de continuidad.","refuerzosTexto":"","iso27001":"5.30 Preparación TIC continuidad (pruebas); 8.14 Redundancia","guias":"CCN-STIC 804/808; ISO 22301"},"op.cont.4":{"nombre":"Medios alternativos","dims":"D","bajo":"n.a.","medio":"n.a.","alto":"aplica","texto":"– [op.cont.4.1] Estará prevista la disponibilidad de medios alternativos para poder seguir prestando servicio cuando los medios habituales no estén disponibles. En concreto, se cubrirán los siguientes elementos del sistema:\na) Servicios contratados a terceros.\nb) Instalaciones alternativas.\nc) Personal alternativo.\nd) Equipamiento informático alternativo.\ne) Medios de comunicación alternativos.\n– [op.cont.4.2] Se establecerá un tiempo máximo para que los medios alternativos entren en funcionamiento.\n– [op.cont.4.3] Los medios alternativos estarán sometidos a las mismas garantías de seguridad que los originales.","refuerzosTexto":"","iso27001":"8.14 Redundancia de instalaciones de tratamiento; 5.30 Preparación TIC continuidad","guias":"CCN-STIC 804/808; ISO 22301"},"op.mon.1":{"nombre":"Detección de intrusión","dims":"Categoría","bajo":"aplica","medio":"+ R1","alto":"+ R1 + R2","texto":"– [op.mon.1.1] Se dispondrá de herramientas de detección o prevención de intrusiones.","refuerzosTexto":"R1-Detección basada en reglas.\n– [op.mon.1.r1.1] El sistema dispondrá de herramientas de detección o prevención de intrusiones basadas en reglas.\n\nR2-Procedimientos de respuesta.\n– [op.mon.1.r2.1] Existirán procedimientos de respuesta a las alertas generadas por el sistema de detección o prevención de intrusiones.","iso27001":"8.16 Actividades de monitorización; 8.20 Seguridad de redes; 8.15 Registro","guias":"CCN-STIC 815, 817, 804/808"},"op.mon.2":{"nombre":"Sistema de métricas","dims":"Categoría","bajo":"aplica","medio":"+ R1 + R2","alto":"+ R1 + R2","texto":"– [op.mon.2.1] Atendiendo a la categoría de seguridad del sistema, se recopilarán los datos necesarios para conocer el grado de implantación de las medidas de seguridad que resulten aplicables y, en su caso, para proveer el informe anual requerido por el artículo 32.","refuerzosTexto":"R1-Efectividad del sistema de gestión de incidentes.\n– [op.mon.2.r1.1] Se recopilarán los datos precisos que posibiliten evaluar el comportamiento del sistema de gestión de incidentes, de acuerdo con la Instrucción Técnica de Seguridad de Notificación de Incidentes de Seguridad y con la correspondiente guía CCN-STIC.\n\nR2-Eficiencia del sistema de gestión de la seguridad.\n– [op.mon.2.r2.1] Se recopilarán los datos precisos para conocer la eficiencia del sistema de seguridad, en relación con los recursos consumidos, en términos de horas y presupuesto.","iso27001":"Cl. 9.1 Seguimiento, medición, análisis y evaluación; 5.36 Cumplimiento de políticas","guias":"CCN-STIC 815, 817, 804/808"},"op.mon.3":{"nombre":"Vigilancia","dims":"Categoría","bajo":"aplica","medio":"+ R1 + R2","alto":"+ R1 + R2 + R3 + R4 + R5 + R6","texto":"– [op.mon.3.1] Se dispondrá de un sistema automático de recolección de eventos de seguridad.","refuerzosTexto":"R1-Correlación de eventos.\n– [op.mon.3.r1.1] Se dispondrá de un sistema automático de recolección de eventos de seguridad que permita la correlación de los mismos.\n\nR2-Análisis dinámico.\n– [op.mon.3.r2.1] Se dispondrá de soluciones de vigilancia que permitan determinar la superficie de exposición con relación a vulnerabilidades y deficiencias de configuración.\n\nR3-Ciberamenazas avanzadas.\n– [op.mon.3.r3.1] Se dispondrá de sistemas para detección de amenazas avanzadas y comportamientos anómalos.\n– [op.mon.3.r3.2] Se dispondrá de sistemas para la detección de amenazas persistentes avanzadas (Advanced Persistent Threat, APT) mediante la detección de anomalías significativas en el tráfico de la red.\n\nR4-Observatorios digitales.\n– [op.mon.3.r4.1] Se dispondrá de observatorios digitales con fines de cibervigilancia dedicados a la detección y seguimiento de anomalías que pudieran representar indicadores de amenaza en contenidos digitales.\n\nR5-Minería de datos.\nSe aplicarán medidas para prevenir, detectar y reaccionar frente a intentos de minería de datos:\n– [op.mon.3.r5.1] Limitación de las consultas, monitorizando volumen y frecuencia.\n– [op.mon.3.r5.2] Alerta a los administradores de seguridad de comportamientos sospechosos en tiempo real.\n\nR6-Inspecciones de seguridad.\nPeriódicamente, o tras incidentes que hayan desvelado vulnerabilidades del sistema nuevas o subestimadas, se realizarán las siguientes inspecciones:\n– [op.mon.3.r6.1] Verificación de configuración.\n– [op.mon.3.r6.2] Análisis de vulnerabilidades.\n– [op.mon.3.r6.3] Pruebas de penetración.","iso27001":"5.7 Inteligencia de amenazas; 8.16 Actividades de monitorización; 8.8 Vulnerabilidades técnicas","guias":"CCN-STIC 815, 817, 804/808"},"mp.if.1":{"nombre":"Áreas separadas y con control de acceso","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.if.1.1] El equipamiento del Centro de Proceso de Datos (CPD) se instalará, en la medida de lo posible, en áreas separadas, específicas para su función.\n– [mp.if.1.2] Se controlarán los accesos a las áreas indicadas de forma que sólo se pueda acceder por las entradas previstas.","refuerzosTexto":"","iso27001":"7.1 Perímetros de seguridad física; 7.2 Entradas físicas; 7.3 Oficinas, salas e instalaciones; 7.4 Vigilancia física; 7.6 Trabajo en áreas seguras","guias":"CCN-STIC 804/808"},"mp.if.2":{"nombre":"Identificación de las personas","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"[mp.if.2.1] El procedimiento de control de acceso identificará a las personas que accedan a los locales donde hay equipamiento esencial que forme parte del sistema de información del CPD, registrando las correspondientes entradas y salidas.","refuerzosTexto":"","iso27001":"7.2 Controles físicos de entrada; 7.4 Vigilancia de la seguridad física","guias":"CCN-STIC 804/808"},"mp.if.3":{"nombre":"Acondicionamiento de los locales","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"Los locales donde se ubiquen los sistemas de información y sus componentes esenciales dispondrán de elementos adecuados para el eficaz funcionamiento del equipamiento allí instalado, y, en especial, para asegurar:\n– [mp.if.3.1] Las condiciones de temperatura y humedad.\n– [mp.if.3.2] La protección frente a las amenazas identificadas en el análisis de riesgos.\n– [mp.if.3.3] La protección del cableado frente a incidentes fortuitos o deliberados.","refuerzosTexto":"","iso27001":"7.5 Protección contra amenazas físicas y ambientales; 7.8 Ubicación y protección de equipos; 7.12 Seguridad del cableado","guias":"CCN-STIC 804/808"},"mp.if.4":{"nombre":"Energía eléctrica","dims":"D","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"– [mp.if.4.1] Los locales donde se ubiquen los sistemas de información y sus componentes esenciales dispondrán de tomas de energía eléctrica, de modo que se garantice el suministro y el correcto funcionamiento de las luces de emergencia.","refuerzosTexto":"R1-Suministro eléctrico de emergencia.\n– [mp.if.4.r1.1] En caso de fallo del suministro principal, el abastecimiento eléctrico deberá estar garantizado durante el tiempo suficiente para una terminación ordenada de los procesos y la salvaguarda de la información.","iso27001":"7.11 Servicios de suministro; 7.5 Amenazas físicas y ambientales","guias":"CCN-STIC 804/808"},"mp.if.5":{"nombre":"Protección frente a incendios","dims":"D","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.if.5.1] Los locales donde se ubiquen los sistemas de información y sus componentes esenciales se protegerán frente a incendios atendiendo, al menos, a la normativa industrial de aplicación.","refuerzosTexto":"","iso27001":"7.5 Protección contra amenazas físicas y ambientales","guias":"CCN-STIC 804/808"},"mp.if.6":{"nombre":"Protección frente a inundaciones","dims":"D","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"– [mp.if.6.1] Los locales donde se ubiquen los sistemas de información y sus componentes esenciales se protegerán frente a incidentes causados por el agua.","refuerzosTexto":"","iso27001":"7.5 Protección contra amenazas físicas y ambientales","guias":"CCN-STIC 804/808"},"mp.if.7":{"nombre":"Registro de entrada y salida de equipamiento","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.if.7.1] Se llevará un registro pormenorizado de cualquier entrada y salida de equipamiento esencial, incluyendo la identificación de la persona que autoriza el movimiento.","refuerzosTexto":"","iso27001":"7.2 Controles físicos de entrada; 7.9 Seguridad de activos fuera de las instalaciones; 7.10 Soportes de almacenamiento","guias":"CCN-STIC 804/808"},"mp.per.1":{"nombre":"Caracterización del puesto de trabajo","dims":"Categoría","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"– [mp.per.1.1] Para cada puesto de trabajo, relacionado directamente con el manejo de información o servicios, se definirán las responsabilidades en materia de seguridad, que estarán basadas en el análisis de riesgos.\n– [mp.per.1.2] Se definirán los requisitos que deben satisfacer las personas que vayan a ocupar el puesto de trabajo, en particular, en términos de confidencialidad. Dichos requisitos se tendrán en cuenta en la selección de la persona que vaya a ocupar el puesto, incluyendo la verificación de sus antecedentes laborales, formación y otras referencias, de conformidad con el ordenamiento jurídico y el respeto a los derechos fundamentales.","refuerzosTexto":"","iso27001":"6.1 Selección (cribado); 6.2 Términos y condiciones de empleo; 5.2 Roles y responsabilidades","guias":"CCN-STIC 804/808, 821"},"mp.per.2":{"nombre":"Deberes y obligaciones","dims":"Categoría","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"Se informará a cada persona que trabaje en el sistema de los deberes y responsabilidades de su puesto de trabajo en materia de seguridad, contemplando:\n– [mp.per.2.1] Las medidas disciplinarias a que haya lugar.\n– [mp.per.2.2] Contemplando tanto el periodo durante el cual se desempeña el puesto, como las obligaciones en caso de término de la asignación, o traslado a otro puesto de trabajo.\n– [mp.per.2.3] El deber de confidencialidad respecto de los datos a los que tenga acceso, tanto durante el periodo que esté adscrito al puesto de trabajo, como posteriormente a su terminación.\n– [mp.per.2.4] En caso de personal contratado a través de un tercero:\n• [mp.per.2.4.1] Se establecerán los deberes y obligaciones de cada parte y del personal contratado.\n• [mp.per.2.4.2] Se establecerá el procedimiento de resolución de incidentes relacionados con el incumplimiento de las obligaciones.","refuerzosTexto":"R1-Confirmación expresa.\n– [mp.per.2.r1.1] Se ha de obtener la confirmación expresa de que los usuarios conocen las instrucciones de seguridad necesarias y obligatorias y su aceptación, así como los procedimientos necesarios para llevarlas a cabo de manera adecuada.","iso27001":"6.2 Términos y condiciones; 6.4 Proceso disciplinario; 6.5 Responsabilidades tras la finalización; 6.6 Acuerdos de confidencialidad; 5.11 Devolución de activos","guias":"CCN-STIC 804/808, 821"},"mp.per.3":{"nombre":"Concienciación","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"Se realizarán las acciones necesarias para concienciar regularmente al personal acerca de su papel y responsabilidad para que la seguridad del sistema alcance los niveles exigidos. En particular, se recordará periódicamente:\n– [mp.per.3.1] La normativa de seguridad relativa al buen uso de los equipos o sistemas y las técnicas de ingeniería social más habituales.\n– [mp.per.3.2] La identificación de incidentes, actividades o comportamientos sospechosos que deban ser reportados para su tratamiento por personal especializado.\n– [mp.per.3.3] El procedimiento para informar sobre incidentes de seguridad, sean reales o falsas alarmas.","refuerzosTexto":"","iso27001":"6.3 Concienciación, educación y formación en seguridad","guias":"CCN-STIC 804/808, 821"},"mp.per.4":{"nombre":"Formación","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.per.4.1] Se formará regularmente al personal en aquellas materias relativas a seguridad de la información que requiera el desempeño de sus funciones, en particular en lo relativo a:\na) Configuración de sistemas.\nb) Detección y reacción ante incidentes.\nc) Gestión de la información en cualquier soporte en el que se encuentre. Se cubrirán al menos las siguientes actividades: almacenamiento, transferencia, copias, distribución y destrucción.\nAdemás, se evaluará la eficacia de las acciones formativas llevadas a cabo.","refuerzosTexto":"","iso27001":"6.3 Concienciación, educación y formación; Cl. 7.2 Competencia","guias":"CCN-STIC 804/808, 821"},"mp.eq.1":{"nombre":"Puesto de trabajo despejado","dims":"Categoría","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"– [mp.eq.1.1] Los puestos de trabajo permanecerán despejados, sin que exista material distinto del necesario en cada momento.","refuerzosTexto":"R1-Almacenamiento del material.\n– [mp.eq.1.r1.1] Una vez usado, y siempre que sea factible, el material se almacenará en lugar cerrado.","iso27001":"7.7 Escritorio y pantalla despejados","guias":"CCN-STIC 804/808, 5xx"},"mp.eq.2":{"nombre":"Bloqueo de puesto de trabajo","dims":"A","bajo":"n.a.","medio":"aplica","alto":"+ R1","texto":"– [mp.eq.2.1] El puesto de trabajo se bloqueará al cabo de un tiempo prudencial de inactividad, requiriendo una nueva autenticación del usuario para reanudar la actividad en curso.","refuerzosTexto":"R1-Cierre de sesiones.\n– [mp.eq.2.r1.1] Pasado un cierto tiempo, superior al anterior, se cancelarán las sesiones abiertas desde dicho puesto de trabajo.\nUna Guía CCN-STIC concretará la implementación de la configuración de seguridad adaptada a la categorización del sistema o perfil de cumplimiento asociado.","iso27001":"7.7 Escritorio y pantalla despejados; 8.1 Dispositivos de usuario","guias":"CCN-STIC 804/808, 5xx"},"mp.eq.3":{"nombre":"Protección de dispositivos portátiles","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"+ R1 + R2","texto":"Los equipos (ordenadores portátiles, tabletas, etc.) que sean susceptibles de salir de las instalaciones de la organización y no puedan beneficiarse de la protección física correspondiente, con un riesgo manifiesto de pérdida o robo, serán protegidos adecuadamente.\nSin perjuicio de las medidas generales que les afecten, se adoptarán las siguientes:\n– [mp.eq.3.1] Se llevará un inventario de dispositivos portátiles junto con una identificación de la persona responsable de cada uno de ellos y un control regular de que está positivamente bajo su control.\n– [mp.eq.3.2] Se establecerá un procedimiento operativo de seguridad para informar al servicio de gestión de incidentes de pérdidas o sustracciones.\n– [mp.eq.3.3] Cuando un dispositivo portátil se conecte remotamente a través de redes que no están bajo el estricto control de la organización, el ámbito de operación del servidor limitará la información y los servicios accesibles a los mínimos imprescindibles, requiriendo autorización previa de los responsables de la información y los servicios afectados. Este punto es de aplicación a conexiones a través de internet y otras redes que no sean de confianza.\n– [mp.eq.3.4] Se evitará, en la medida de lo posible, que el dispositivo portátil contenga claves de acceso remoto a la organización que no sean imprescindibles. Se considerarán claves de acceso remoto aquellas que sean capaces de habilitar un acceso a otros equipos de la organización u otras de naturaleza análoga.","refuerzosTexto":"R1– Cifrado del disco.\n– [mp.eq.3.r1.1] Se protegerá el dispositivo portátil mediante cifrado del disco duro cuando el nivel de confidencialidad de la información almacenada en el mismo sea de nivel MEDIO.\n\nR2– Entornos protegidos.\n– [mp.eq.3.r2.1] El uso de dispositivos portátiles fuera de las instalaciones de la organización se restringirá a entornos protegidos, donde el acceso sea controlado y a salvo de hurtos y miradas indiscretas.","iso27001":"8.1 Dispositivos de usuario; 7.9 Activos fuera de las instalaciones; 6.7 Trabajo remoto; 8.24 Criptografía","guias":"CCN-STIC 804/808, 5xx"},"mp.eq.4":{"nombre":"Otros dispositivos conectados a la red","dims":"C","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"Esta medida afecta a todo tipo de dispositivos conectados a la red y que puedan tener en algún momento acceso a la información, tales como:\na) Dispositivos multifunción: impresoras, escáneres, etc.\nb) Dispositivos multimedia: proyectores, altavoces inteligentes, etc.\nc) Dispositivos internet de las cosas, en inglés Internet of Things (IoT).\nd) Dispositivos de invitados y los personales de los propios empleados, en inglés Bring Your Own Device (BYOD).\ne) Otros.\n– [mp.eq.4.1] Los dispositivos presentes en el sistema deberán contar con una configuración de seguridad adecuada de manera que se garantice el control del flujo definido de entrada y salida de la información.\n– [mp.eq.4.2] Los dispositivos presentes en la red que dispongan de algún tipo de almacenamiento temporal o permanente de información proporcionarán la funcionalidad necesaria para eliminar información de soportes de información. (Ver [mp.si.5]).","refuerzosTexto":"R1-Productos certificados.\n– [mp.eq.4.r1.1] Se usarán, cuando sea posible, productos o servicios que cumplan lo establecido en [op.pl.5].","iso27001":"8.1 Dispositivos de usuario; 8.20 Seguridad de redes; 5.9 Inventario","guias":"CCN-STIC 804/808, 5xx"},"mp.com.1":{"nombre":"Perímetro seguro","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.com.1.1] Se dispondrá de un sistema de protección perimetral que separe la red interna del exterior. Todo el tráfico deberá atravesar dicho sistema.\n– [mp.com.1.2] Todos los flujos de información a través del perímetro deben estar autorizados previamente.\nLa Instrucción Técnica de Seguridad de Interconexión de Sistemas de Información determinará los requisitos establecidos en el perímetro que han de cumplir todos los componentes del sistema en función de la categoría.","refuerzosTexto":"","iso27001":"8.20 Seguridad de redes; 8.21 Seguridad de servicios de red; 8.22 Segregación de redes","guias":"CCN-STIC 807, 811, 804/808"},"mp.com.2":{"nombre":"Protección de la confidencialidad","dims":"C","bajo":"aplica","medio":"+ R1","alto":"+ R1 + R2 + R3","texto":"– [mp.com.2.1] Se emplearán redes privadas virtuales cifradas cuando la comunicación discurra por redes fuera del propio dominio de seguridad.","refuerzosTexto":"R1-Algoritmos y parámetros autorizados.\n– [mp.com.2.r1.1] Se emplearán algoritmos y parámetros autorizados por el CCN.\n\nR2-Dispositivos hardware.\n– [mp.com.2.r2.1] Se emplearán, dispositivos hardware en el establecimiento y utilización de la red privada virtual.\n\nR3-Productos certificados.\n– [mp.com.2.r3.1] Se usarán productos o servicios que cumplan lo establecido en [op.pl.5].","iso27001":"8.24 Uso de criptografía; 8.20/8.21 Redes; 5.14 Transferencia de información","guias":"CCN-STIC 807, 811, 804/808"},"mp.com.3":{"nombre":"Protección de la integridad y de la autenticidad","dims":"IA","bajo":"aplica","medio":"+ R1 + R2","alto":"+ R1 + R2 + R3 + R4","texto":"– [mp.com.3.1] En comunicaciones con puntos exteriores al dominio propio de seguridad, se asegurará la autenticidad del otro extremo del canal de comunicación antes de intercambiar información. (Ver [op.acc.5]).\n– [mp.com.3.2] Se prevendrán ataques activos garantizando que al ser detectados se activarán los procedimientos previstos de tratamiento del incidente. Se considerarán ataques activos:\na) La alteración de la información en tránsito.\nb) La inyección de información espuria.\nc) El secuestro de la sesión por una tercera parte.\n– [mp.com.3.3] Se aceptará cualquier mecanismo de identificación y autenticación de los previstos en el ordenamiento jurídico y en la normativa de aplicación.","refuerzosTexto":"R1-Redes privadas virtuales.\n– [mp.com.3.r1.1] Se emplearán redes privadas virtuales cifradas cuando la comunicación discurra por redes fuera del propio dominio de seguridad.\n\nR2-Algoritmos y parámetros autorizados.\n– [mp.com.3.r2.1] Se emplearán algoritmos y parámetros autorizados por el CCN.\n\nR3-Dispositivos hardware.\n– [mp.com.3.r3.1] Se recomienda emplear dispositivos hardware en el establecimiento y utilización de la red privada virtual.\n\nR4-Productos certificados.\n– [mp.com.3.r4.1] Se emplearán productos certificados conforme a lo establecido en [op.pl.5].","iso27001":"8.24 Uso de criptografía; 8.20/8.21 Redes; 6.7 Trabajo remoto (VPN)","guias":"CCN-STIC 807, 811, 804/808"},"mp.com.4":{"nombre":"Separación de flujos de información en la red","dims":"Categoría","bajo":"n.a.","medio":"+ [R1 o R2 o R3]","alto":"+ [R2 o R3] + R4","texto":"La segmentación acota el acceso a la información y, consiguientemente, la propagación de los incidentes de seguridad, que quedan restringidos al entorno donde ocurren.\nCuando la transmisión de información por la red se restringe a ciertos segmentos, se acota el acceso a la información y los incidentes de seguridad quedan encapsulados en su segmento.\nLos flujos de información se separarán en segmentos de forma que:\n– [mp.com.4.1] El tráfico por la red se segregará para que cada equipo solamente tenga acceso a la información que necesita.\n– [mp.com.4.2] Si se emplean comunicaciones inalámbricas, será en un segmento separado.","refuerzosTexto":"R1-Segmentación lógica básica.\n– [mp.com.4.r1.1] Los segmentos de red se implementarán por medio de redes de área local virtuales (Virtual Local Area Network, VLAN).\n– [mp.com.4.r1.2] La red que conforma el sistema deberá segregarse en distintas subredes contemplando como mínimo:\n• Usuarios.\n• Servicios.\n• Administración.\n\nR2-Segmentación lógica avanzada.\n– [mp.com.4.r2.1] Los segmentos de red se implementarán por medio de redes privadas virtuales (Virtual Private Network, VPN).\n\nR3-Segmentación física.\n– [mp.com.4.r3.1] Los segmentos de red se implementarán con medios físicos separados.\n\nR4-Puntos de interconexión.\n– [mp.com.4.r4.1] Control de entrada de los usuarios que llegan a cada segmento y control de entrada y salida de la información disponible en cada segmento.\n– [mp.com.4.r4.2] El punto de interconexión estará particularmente asegurado, mantenido y monitorizado, (como en [mp.com.1]).","iso27001":"8.22 Segregación de redes; 8.20 Seguridad de redes","guias":"CCN-STIC 807, 811, 804/808"},"mp.si.1":{"nombre":"Marcado de soportes","dims":"C","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"– [mp.si.1.1] Los soportes de información (papel impreso, documentos electrónicos,\ncontenidos multimedia -vídeos, cursos, presentaciones- etc.) que contengan información\nque según [mp.info.2] deba protegerse con medidas de seguridad específicas, llevarán\nlas marcas o metadatos correspondientes que indiquen el nivel de seguridad de la\ninformación contenida de mayor calificación.","refuerzosTexto":"","iso27001":"5.13 Etiquetado de la información; 7.10 Soportes de almacenamiento","guias":"CCN-STIC 807, 804/808"},"mp.si.2":{"nombre":"Criptografía","dims":"IC","bajo":"n.a.","medio":"aplica","alto":"+ R1 + R2","texto":"Esta medida se aplica, en particular, a todos los dispositivos removibles cuando salen de un área controlada. Se entenderán por dispositivos removibles, los CD, DVD, discos extraíbles, pendrives, memorias USB u otros de naturaleza análoga.\n– [mp.si.2.1] Se usarán mecanismos criptográficos que garanticen la confidencialidad y la integridad de la información contenida.\n– [mp.si.2.2] Se emplearán algoritmos y parámetros autorizados por el CCN.","refuerzosTexto":"R1– Productos certificados.\n– [mp.si.2.r1.1] Se emplearán productos certificados conforme a lo establecido en [op.pl.5].\n\nR2-Copias de seguridad.\n– [mp.si.2.r2.1] Las copias se seguridad se cifrarán utilizando algoritmos y parámetros autorizados por el CCN.","iso27001":"8.24 Uso de criptografía; 7.10 Soportes de almacenamiento; 8.12 Prevención de fuga de datos","guias":"CCN-STIC 807, 804/808"},"mp.si.3":{"nombre":"Custodia","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.si.3.1] Se aplicará la debida diligencia y control a los soportes de información que permanecen bajo la responsabilidad de la organización, garantizando el control de acceso con medidas físicas ([mp.if.1] y [mp.if.7]) o lógicas ([mp.si.2]).\n– [mp.si.3.2] Se respetarán las exigencias de mantenimiento del fabricante, en especial, en lo referente a temperatura, humedad y otros agentes medioambientales.","refuerzosTexto":"","iso27001":"7.10 Soportes de almacenamiento; 5.9 Inventario; 5.10 Uso aceptable","guias":"CCN-STIC 807, 804/808"},"mp.si.4":{"nombre":"Transporte","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"El responsable del sistema garantizará que los dispositivos permanecen bajo control y que satisfacen sus requisitos de seguridad mientras están siendo desplazados de un lugar a otro, fuera de las zonas controladas por la organización.\n– [mp.si.4.1] Se dispondrá de un registro de entrada/salida que identifique al transportista que entrega/recibe el soporte.\n– [mp.si.4.2] Se dispondrá de un procedimiento rutinario que coteje las salidas con las llegadas y levante las alarmas pertinentes cuando se detecte algún incidente.\n– [mp.si.4.3] Se utilizarán los medios de protección criptográfica ([mp.si.2]) correspondientes al mayor nivel de seguridad de la información contenida.\n– [mp.si.4.4] Se gestionarán las claves según [op.exp.10].","refuerzosTexto":"","iso27001":"7.10 Soportes de almacenamiento; 7.9 Activos fuera de las instalaciones; 5.14 Transferencia","guias":"CCN-STIC 807, 804/808"},"mp.si.5":{"nombre":"Borrado y destrucción","dims":"C","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"La medida de borrado y destrucción de soportes de información se aplicará a todo tipo de equipos y soportes susceptibles de almacenar información, incluyendo medios electrónicos y no electrónicos.\n– [mp.si.5.1] Los soportes que vayan a ser reutilizados para otra información o liberados a otra organización serán objeto del borrado seguro de su contenido que no permita su recuperación. Cuando la naturaleza del soporte no permita un borrado seguro, el soporte no podrá ser reutilizado en ningún otro sistema.\nLas guías CCN-STIC del CCN precisarán los criterios para definir como seguro un mecanismo de borrado o de destrucción, en función de la sensibilidad de la información almacenada en el dispositivo.","refuerzosTexto":"R1-Productos certificados.\n– [mp.si.5.r1.1] Se usarán productos o servicios que cumplan lo establecido en [op.pl.5].","iso27001":"7.10 Soportes; 7.14 Eliminación segura o reutilización de equipos; 8.10 Borrado de información","guias":"CCN-STIC 807, 804/808"},"mp.sw.1":{"nombre":"Desarrollo de aplicaciones","dims":"Categoría","bajo":"n.a.","medio":"+ R1 + R2 + R3 + R4","alto":"+ R1 + R2 + R3 + R4","texto":"– [mp.sw.1.1] El desarrollo de aplicaciones se realizará sobre un sistema diferente y separado del de producción, no debiendo existir herramientas o datos de desarrollo en el entorno de producción, ni datos de producción en el de desarrollo.","refuerzosTexto":"R1-Mínimo privilegio.\n– [mp.sw.1.r1.1] Las aplicaciones se desarrollarán respetando el principio de mínimo privilegio, accediendo únicamente a los recursos imprescindibles para su función, y con los privilegios que sean indispensables.\n\nR2-Metodología de desarrollo seguro.\n– [mp.sw.1.r2.1] Se aplicará una metodología de desarrollo seguro reconocida que:\na) Tendrá en consideración los aspectos de seguridad a lo largo de todo el ciclo de vida.\nb) Incluirá normas de programación segura, especialmente: control de asignación y liberación de memoria, desbordamiento de memoria (overflow).\nc) Tratará específicamente los datos usados en pruebas.\nd) Permitirá la inspección del código fuente.\n\nR3-Seguridad desde el diseño.\n– [mp.sw.1.r3.1] Los siguientes elementos serán parte integral del diseño del sistema:\na) Los mecanismos de identificación y autenticación.\nb) Los mecanismos de protección de la información tratada.\nc) La generación y tratamiento de pistas de auditoría.\n\nR4-Datos de pruebas.\n– [mp.sw.1.r4.1] Preferiblemente, las pruebas previas a la implantación o modificación de los sistemas de información no se realizarán con datos reales. En caso de que fuese necesario recurrir a datos reales se garantizará el nivel de seguridad correspondiente.","iso27001":"8.25 Ciclo de vida de desarrollo seguro; 8.26 Requisitos de seguridad de aplicaciones; 8.27 Arquitectura segura; 8.28 Codificación segura; 8.30 Desarrollo externalizado; 8.4 Código fuente","guias":"CCN-STIC 804/808; OWASP SAMM"},"mp.sw.2":{"nombre":"Aceptación y puesta en servicio","dims":"Categoría","bajo":"aplica","medio":"+ R1","alto":"+ R1","texto":"Antes de pasar a producción se comprobará el correcto funcionamiento de la aplicación.\n– [mp.sw.2.1] Se comprobará que:\na) Se cumplen los criterios de aceptación en materia de seguridad.\nb) No se deteriora la seguridad de otros componentes del servicio.","refuerzosTexto":"R1- Pruebas.\n– [mp.sw.2.r1.1] Las pruebas se realizarán en un entorno aislado (pre-producción).","iso27001":"8.29 Pruebas de seguridad en desarrollo y aceptación; 8.31 Separación de entornos; 8.33 Información de pruebas; 8.11 Enmascaramiento de datos","guias":"CCN-STIC 804/808; OWASP SAMM"},"mp.info.1":{"nombre":"Datos personales","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.info.1.1] Cuando el sistema trate datos personales, el responsable de seguridad recogerá los requisitos de protección de datos que sean fijados por el responsable o por el encargado del tratamiento, contando con el asesoramiento del DPD, y que sean necesarios implementar en los sistemas de acuerdo a la naturaleza, alcance, contexto y fines del mismo, así como de los riesgos para los derechos y libertades de acuerdo a lo establecido en los artículos 24 y 32 del RGPD, y de acuerdo a la evaluación de impacto en la protección de datos, si se ha llevado a cabo.","refuerzosTexto":"","iso27001":"5.34 Privacidad y protección de la PII; 5.31 Requisitos legales; 8.11 Enmascaramiento","guias":"CCN-STIC 807, 804/808"},"mp.info.2":{"nombre":"Calificación de la información","dims":"C","bajo":"n.a.","medio":"aplica","alto":"aplica","texto":"– [mp.info.2.1] Para calificar la información se estará a lo establecido legalmente por las leyes y tratados internacionales de los que España es miembro y su normativa de aplicación cuando se trate de materias clasificadas. El valor a emplear en el caso de información de materias no clasificadas sería USO OFICIAL para información con algún tipo de restricción en su manejo por su sensibilidad y confidencialidad.\n– [mp.info.2.2] La política de seguridad establecerá quién es el responsable de cada información manejada por el sistema.\n– [mp.info.2.3] La política de seguridad recogerá, directa o indirectamente, los criterios que, en cada organización, determinarán el nivel de seguridad requerido, dentro del marco establecido en el artículo 40 y los criterios generales señalados en el anexo I.\n– [mp.info.2.4] El responsable de cada información seguirá los criterios determinados en el apartado anterior para asignar a cada información el nivel de seguridad requerido, y será responsable de su documentación y aprobación formal.\n– [mp.info.2.5] El responsable de cada información en cada momento tendrá en exclusiva la potestad de modificar el nivel de seguridad requerido, de acuerdo a los apartados anteriores.","refuerzosTexto":"","iso27001":"5.12 Clasificación de la información; 5.13 Etiquetado","guias":"CCN-STIC 807, 804/808"},"mp.info.3":{"nombre":"Firma electrónica","dims":"IA","bajo":"aplica","medio":"+ R1 + R2 + R3","alto":"+ R1 + R2 + R3 + R4","texto":"– [mp.info.3.1] Se empleará cualquier tipo de firma electrónica de los previstos en el vigente ordenamiento jurídico, entre ellos, los sistemas de código seguro de verificación vinculados a la Administración Pública, órgano, organismo público o entidad de derecho público, en los términos y condiciones establecidos en la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, y en la Ley 40/2015, de 1 de octubre.","refuerzosTexto":"R1-Certificados cualificados.\n– [mp.info.3.r1.1] Cuando se empleen sistemas de firma electrónica avanzada basados en certificados, estos serán cualificados.\n\nR2-Algoritmos y parámetros autorizados.\n– [mp.info.3.r2.1] Se emplearán algoritmos y parámetros autorizados por el CCN o por un esquema nacional o europeo que resulte de aplicación.\nEl CCN determinará los algoritmos criptográficos que hayan sido autorizados nominalmente para su uso en el Esquema Nacional de Seguridad conforme a la Instrucción Técnica de Seguridad Criptología de empleo en el ENS.\n\nR3-Verificación y validación de firma.\n– [mp.info.3.r3.1] Cuando proceda, se garantizará la verificación y validación de la firma electrónica durante el tiempo requerido por la actividad administrativa que aquélla soporte, sin perjuicio de que se pueda ampliar este período de acuerdo con lo que establezca la Política de Firma Electrónica y de Certificados que sea de aplicación. Para tal fin se adjuntará a la firma, o se referenciará, toda la información pertinente para su verificación y validación, incluyendo certificados o datos de verificación y validación.\n\nR4-Firma electrónica avanzada basada en certificados cualificados.\n– [mp.info.3.r4.1] Se usará firma electrónica avanzada basada en certificados cualificados complementada por un segundo factor del tipo «algo que se sabe» o «algo que se es».","iso27001":"8.24 Uso de criptografía; 8.26 Requisitos de seguridad de aplicaciones; 5.31 Requisitos legales (Reglamento eIDAS)","guias":"CCN-STIC 807, 804/808"},"mp.info.4":{"nombre":"Sellos de tiempo","dims":"T","bajo":"n.a.","medio":"n.a.","alto":"aplica","texto":"La utilización de sellos de tiempo exigirá adoptar las siguientes cautelas:\n– [mp.info.4.1] Los sellos de tiempo se aplicarán a aquella información que sea susceptible de ser utilizada como evidencia electrónica en el futuro.\n– [mp.info.4.2] Los datos pertinentes para la verificación posterior de la fecha serán tratados con la misma seguridad que la información fechada a efectos de disponibilidad, integridad y confidencialidad.\n– [mp.info.4.3] Se renovarán regularmente los sellos de tiempo hasta que la información protegida ya no sea requerida por el proceso administrativo al que da soporte, en su caso.\n– [mp.info.4.4] Se emplearán \"sellos cualificados de tiempo electrónicos\" atendiendo a lo dispuesto en el Reglamento (UE) n.º 910/2014 y normativa de desarrollo.","refuerzosTexto":"","iso27001":"8.24 Uso de criptografía; 8.17 Sincronización de relojes; 8.26 Requisitos de aplicaciones","guias":"CCN-STIC 807, 804/808"},"mp.info.5":{"nombre":"Limpieza de documentos","dims":"C","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"– [mp.info.5.1] En el proceso de limpieza de documentos, se retirará de estos toda la información adicional contenida en campos ocultos, metadatos, comentarios o revisiones anteriores, salvo cuando dicha información sea pertinente para el receptor del documento.\nEsta medida es especialmente relevante cuando el documento se difunde ampliamente, como ocurre cuando se ofrece al público en un servidor web u otro tipo de repositorio de información.","refuerzosTexto":"","iso27001":"5.14 Transferencia de información; 8.10 Borrado de información (sin equivalente directo)","guias":"CCN-STIC 807, 804/808"},"mp.info.6":{"nombre":"Copias de seguridad","dims":"D","bajo":"aplica","medio":"+ R1","alto":"+ R1 + R2","texto":"– [mp.info.6.1] Se realizarán copias de seguridad que permitan recuperar datos perdidos, accidental o intencionadamente. La periodicidad y los plazos de retención de estas copias de seguridad se determinarán en la normativa interna de la organización relativa a copias de seguridad.\n– [mp.info.6.2] Los procedimientos de respaldo establecidos indicarán:\na) Frecuencia de las copias.\nb) Requisitos de almacenamiento en el propio lugar.\nc) Requisitos de almacenamiento en otros lugares.\nd) Controles para el acceso autorizado a las copias de respaldo.","refuerzosTexto":"R1-Pruebas de recuperación.\n– [mp.info.6.r1.1] Los procedimientos de copia de seguridad y restauración deben probarse regularmente. Su frecuencia dependerá de la criticidad de los datos y del impacto que cause la falta de disponibilidad.\n\nR2-Protección de las copias de seguridad.\n– [mp.info.6.r2.1] Al menos, una de las copias de seguridad se almacenará de forma separada en lugar diferente, de tal manera que un incidente no pueda afectar tanto al repositorio original como a la copia simultáneamente.","iso27001":"8.13 Copias de seguridad de la información; 8.14 Redundancia","guias":"CCN-STIC 807, 804/808"},"mp.s.1":{"nombre":"Protección del correo electrónico","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"aplica","texto":"El correo electrónico se protegerá frente a las amenazas que le son propias, actuando del siguiente modo:\n– [mp.s.1.1] La información distribuida por medio de correo electrónico se protegerá, tanto en el cuerpo de los mensajes como en los anexos.\n– [mp.s.1.2] Se protegerá la información de encaminamiento de mensajes y establecimiento de conexiones.\nSe protegerá a la organización frente a problemas que se materializan por medio del correo electrónico, en concreto:\n– [mp.s.1.3] Correo no solicitado, en su expresión inglesa «spam».\n– [mp.s.1.4] Código dañino, constituidos por virus, gusanos, troyanos, espías, u otros de naturaleza análoga.\n– [mp.s.1.5] Código móvil de tipo micro-aplicación, en su expresión inglesa «applet».\nSe establecerán normas de uso del correo electrónico para el personal. (Ver [org.2]). Estas normas de uso contendrán:\n– [mp.s.1.6] Limitaciones al uso como soporte de comunicaciones privadas.\n– [mp.s.1.7] Actividades de concienciación y formación relativas al uso del correo electrónico.","refuerzosTexto":"","iso27001":"5.14 Transferencia de información; 8.7 Malware; 8.24 Criptografía; 8.23 Filtrado web","guias":"CCN-STIC 804/808, 807"},"mp.s.2":{"nombre":"Protección de servicios y aplicaciones web","dims":"Categoría","bajo":"+ [R1 o R2]","medio":"+ [R1 o R2]","alto":"+ R2 + R3","texto":"Los sistemas que prestan servicios web deberán ser protegidos frente a las siguientes amenazas:\n– [mp.s.2.1] Cuando la información requiera control de acceso se garantizará la imposibilidad de acceder a la información obviando la autenticación, en particular, tomando medidas en los siguientes aspectos:\na) Se evitará que el servidor ofrezca acceso a los documentos por vías alternativas al protocolo determinado.\nb) Se prevendrán ataques de manipulación del localizador uniforme de recursos (Uniform Resource Locator, URL).\nc) Se prevendrán ataques de manipulación de fragmentos de información que se almacena en el disco duro del visitante de una página web a través de su navegador, a petición del servidor de la página, conocido en terminología inglesa como cookies.\nd) Se prevendrán ataques de inyección de código.\n– [mp.s.2.2] Se prevendrán intentos de escalado de privilegios.\n– [mp.s.2.3] Se prevendrán ataques de cross site scripting.","refuerzosTexto":"R1-Auditorías de seguridad.\n– [mp.s.2.r1.1] Se realizarán auditorías continuas de seguridad de «caja negra» sobre las aplicaciones web durante la fase de desarrollo y antes de la fase de producción.\n– [mp.s.2.r1.2] La frecuencia de estas auditorías de seguridad quedará definida en el procedimiento de auditoría.\n\nR2-Auditorías de seguridad avanzada.\n– [mp.s.2.r2.1] Se realizarán auditorías de seguridad de «caja blanca» sobre las aplicaciones web durante la fase de desarrollo.\n– [mp.s.2.r2.2] Se emplearán metodologías definidas y herramientas automáticas de detección de vulnerabilidades en la realización de las auditorías de seguridad sobre las aplicaciones web.\n– [mp.s.2.r2.3] Una vez finalizada una auditoría de seguridad, se analizarán los resultados y se solventarán las vulnerabilidades encontradas mediante los procedimientos definidos [op.exp.5].\n\nR3-Protección de las cachés.\n– [mp.s.2.r3.1] Se prevendrán ataques de manipulación de programas o dispositivos que realizan una acción en representación de otros, conocidos en terminología inglesa como \"proxies\" y, sistemas especiales de almacenamiento de alta velocidad, conocidos en terminología inglesa como \"cachés\".","iso27001":"8.26 Requisitos de seguridad de aplicaciones; 8.29 Pruebas de seguridad; 8.8 Vulnerabilidades técnicas; 8.25 SDLC","guias":"CCN-STIC 804/808, 807"},"mp.s.3":{"nombre":"Protección de la navegación web","dims":"Categoría","bajo":"aplica","medio":"aplica","alto":"+ R1","texto":"El acceso de los usuarios internos a la navegación por internet se protegerá frente a las amenazas que le son propias, actuando del siguiente modo:\n– [mp.s.3.1] Se establecerá una normativa de utilización, definiendo el uso que se autoriza y las limitaciones de uso personal. En particular, se concretará el uso permitido de conexiones cifradas.\n– [mp.s.3.2] Se llevarán a cabo regularmente actividades de concienciación sobre higiene en la navegación web, fomentando el uso seguro y alertando de usos incorrectos.\n– [mp.s.3.3] Se formará al personal encargado de la administración del sistema en monitorización del servicio y respuesta a incidentes.\n– [mp.s.3.4] Se protegerá la información de resolución de direcciones web y de establecimiento de conexiones.\n– [mp.s.3.5] Se protegerá a la organización en general y al puesto de trabajo en particular frente a problemas que se materializan vía navegación web.\n– [mp.s.3.6] Se protegerá contra la actuación de programas dañinos tales como páginas activas, descargas de código ejecutable, etc., previniendo la exposición del sistema a vectores de ataque del tipo spyware, ransomware, etc.\n– [mp.s.3.7] Se establecerá una política ejecutiva de control de cookies, en particular, para evitar la contaminación entre uso personal y uso organizativo.","refuerzosTexto":"R1 - Monitorización.\n– [mp.s.3.r1.1] Se registrará el uso de la navegación web, estableciendo los elementos que se registran, el periodo de retención de estos registros y el uso que el organismo prevé hacer de ellos.\n– [mp.s.3.r1.2] Se establecerá una función para la ruptura de canales cifrados a fin de inspeccionar su contenido, indicando qué se analiza, qué se registra, durante cuánto tiempo se retienen los registros y qué uso prevé hacer el organismo de estas inspecciones. Todo ello sin perjuicio de que se puedan autorizar accesos cifrados singulares a destinos de confianza.\n– [mp.s.3.r1.3] Se establecerá una lista negra de destinos vetados.","iso27001":"8.23 Filtrado web; 8.7 Malware; 8.16 Monitorización","guias":"CCN-STIC 804/808, 807"},"mp.s.4":{"nombre":"Protección frente a denegación de servicio","dims":"D","bajo":"n.a.","medio":"aplica","alto":"+ R1","texto":"Se establecerán medidas preventivas frente a ataques de denegación de servicio y denegación de servicio distribuido (Denial of Service, DoS y Distributed Denial of Service, DDoS). Para ello:\n– [mp.s 4.1] Se planificará y dotará al sistema de capacidad suficiente para atender con holgura a la carga prevista.\n– [mp.s.4.2] Se desplegarán tecnologías para prevenir los ataques conocidos.","refuerzosTexto":"R1-Detección y reacción.\n– [mp.s.4.r1.1] Se establecerá un sistema de detección y tratamiento de ataques de denegación de servicio (DoS y DDoS).\n– [mp.s. 4.r1.2] Se establecerán procedimientos de reacción a los ataques, incluyendo la comunicación con el proveedor de comunicaciones.","iso27001":"8.6 Gestión de la capacidad; 8.16 Monitorización; 8.14 Redundancia; 5.30 Continuidad TIC","guias":"CCN-STIC 804/808, 807"}},"catalogos":{"TIPOS_ACTIVO":[{"code":"[essential.info]","label":"Información esencial","desc":"Datos que dan razón de ser a la organización"},{"code":"[essential.service]","label":"Servicio esencial","desc":"Función que satisface necesidad de usuarios"},{"code":"[D]","lab
