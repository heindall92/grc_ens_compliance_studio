y reaccionar frente a intentos de minería de datos:\n– [op.mon.3.r5.1] Limitación de las consultas, monitorizando volumen y frecuencia.\n– [op.mon.3.r5.2] Alerta a los administradores de seguridad de comportamientos sospechosos en tiempo real.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R6","nombre":"Inspecciones de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R6-Inspecciones de seguridad.\nPeriódicamente, o tras incidentes que hayan desvelado vulnerabilidades del sistema nuevas o subestimadas, se realizarán las siguientes inspecciones:\n– [op.mon.3.r6.1] Verificación de configuración.\n– [op.mon.3.r6.2] Análisis de vulnerabilidades.\n– [op.mon.3.r6.3] Pruebas de penetración.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"mp.if.4","medida":"Energía eléctrica","refuerzo":"R1","nombre":"Suministro eléctrico de emergencia","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Suministro eléctrico de emergencia.\n– [mp.if.4.r1.1] En caso de fallo del suministro principal, el abastecimiento eléctrico deberá estar garantizado durante el tiempo suficiente para una terminación ordenada de los procesos y la salvaguarda de la información.","implementacion":"Dimensión D = ALTO → R1 exigido → cumplido."},{"codigo":"mp.per.2","medida":"Deberes y obligaciones","refuerzo":"R1","nombre":"Confirmación expresa","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Confirmación expresa.\n– [mp.per.2.r1.1] Se ha de obtener la confirmación expresa de que los usuarios conocen las instrucciones de seguridad necesarias y obligatorias y su aceptación, así como los procedimientos necesarios para llevarlas a cabo de manera adecuada.","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.eq.1","medida":"Puesto de trabajo despejado","refuerzo":"R1","nombre":"Almacenamiento del material","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Almacenamiento del material.\n– [mp.eq.1.r1.1] Una vez usado, y siempre que sea factible, el material se almacenará en lugar cerrado.","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.eq.2","medida":"Bloqueo de puesto de trabajo","refuerzo":"R1","nombre":"Cierre de sesiones","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Cierre de sesiones.\n– [mp.eq.2.r1.1] Pasado un cierto tiempo, superior al anterior, se cancelarán las sesiones abiertas desde dicho puesto de trabajo.\nUna Guía CCN-STIC concretará la implementación de la configuración de seguridad adaptada a la categorización del sistema o perfil de cumplimiento asociado.","implementacion":"Dimensión A = ALTO → R1 exigido → cumplido."},{"codigo":"mp.eq.3","medida":"Protección de dispositivos portátiles","refuerzo":"R1","nombre":"Cifrado del disco","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1– Cifrado del disco.\n– [mp.eq.3.r1.1] Se protegerá el dispositivo portátil mediante cifrado del disco duro cuando el nivel de confidencialidad de la información almacenada en el mismo sea de nivel MEDIO.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"mp.eq.3","medida":"Protección de dispositivos portátiles","refuerzo":"R2","nombre":"Entornos protegidos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2– Entornos protegidos.\n– [mp.eq.3.r2.1] El uso de dispositivos portátiles fuera de las instalaciones de la organización se restringirá a entornos protegidos, donde el acceso sea controlado y a salvo de hurtos y miradas indiscretas.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"mp.eq.4","medida":"Otros dispositivos conectados a la red","refuerzo":"R1","nombre":"Productos certificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Productos certificados.\n– [mp.eq.4.r1.1] Se usarán, cuando sea posible, productos o servicios que cumplan lo establecido en [op.pl.5].","implementacion":"Dimensión C = ALTO → R1 exigido → cumplido."},{"codigo":"mp.com.2","medida":"Protección de la confidencialidad","refuerzo":"R1","nombre":"Algoritmos y parámetros autorizados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Algoritmos y parámetros autorizados.\n– [mp.com.2.r1.1] Se emplearán algoritmos y parámetros autorizados por el CCN.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"mp.com.2","medida":"Protección de la confidencialidad","refuerzo":"R2","nombre":"Dispositivos hardware","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Dispositivos hardware.\n– [mp.com.2.r2.1] Se emplearán, dispositivos hardware en el establecimiento y utilización de la red privada virtual.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"mp.com.2","medida":"Protección de la confidencialidad","refuerzo":"R3","nombre":"Productos certificados","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Productos certificados.\n– [mp.com.2.r3.1] Se usarán productos o servicios que cumplan lo establecido en [op.pl.5].","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"mp.com.3","medida":"Protección de la integridad y de la autenticidad","refuerzo":"R1","nombre":"Redes privadas virtuales","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Redes privadas virtuales.\n– [mp.com.3.r1.1] Se emplearán redes privadas virtuales cifradas cuando la comunicación discurra por redes fuera del propio dominio de seguridad.","implementacion":"R3 dispositivos hardware en el extremo cloud → medida compensatoria MC-03."},{"codigo":"mp.com.3","medida":"Protección de la integridad y de la autenticidad","refuerzo":"R2","nombre":"Algoritmos y parámetros autorizados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Algoritmos anzada) + R4; R3 físico adicional para gestión. Cumple '[R2 o R3] + R4'."},{"codigo":"mp.com.4","medida":"Separación de flujos de información en la red","refuerzo":"R4","nombre":"Puntos de interconexión","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Puntos de interconexión.\n– [mp.com.4.r4.1] Control de entrada de los usuarios que llegan a cada segmento y control de entrada y salida de la información disponible en cada segmento.\n– [mp.com.4.r4.2] El punto de interconexión estará particularmente asegurado, mantenido y monitorizado, (como en [mp.com.1]).","implementacion":"Alternativa elegida: R2 (segmentación lógica avanzada) + R4; R3 físico adicional para gestión. Cumple '[R2 o R3] + R4'."},{"codigo":"mp.com.4","medida":"Separación de flujos de información en la red","refuerzo":"R1","nombre":"Segmentación lógica básica","niveles":"MEDIO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Segmentación lógica básica.\n– [mp.com.4.r1.1] Los segmentos de red se implementarán por medio de redes de área local virtuales (Virtual Local Area Network, VLAN).\n– [mp.com.4.r1.2] La red que conforma el sistema deberá segregarse en distintas subredes contemplando como mínimo:\n• Usuarios.\n• Servicios.\n• Administración.","implementacion":"—"},{"codigo":"mp.si.2","medida":"Criptografía","refuerzo":"R1","nombre":"Productos certificados","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1– Productos certificados.\n– [mp.si.2.r1.1] Se emplearán productos certificados conforme a lo establecido en [op.pl.5].","implementacion":"R1 productos certificados para cintas → medida compensatoria MC-04; R2 cumplido."},{"codigo":"mp.si.2","medida":"Criptografía","refuerzo":"R2","nombre":"Copias de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Copias de seguridad.\n– [mp.si.2.r2.1] Las copias se seguridad se cifrarán utilizando algoritmos y parámetros autorizados por el CCN.","implementacion":"R1 productos certificados para cintas → medida compensatoria MC-04; R2 cumplido."},{"codigo":"mp.si.5","medida":"Borrado y destrucción","refuerzo":"R1","nombre":"Productos certificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Productos certificados.\n– [mp.si.5.r1.1] Se usarán productos o servicios que cumplan lo establecido en [op.pl.5].","implementacion":"Dimensión C = ALTO → R1 exigido → cumplido."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R1","nombre":"Mínimo privilegio","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Mínimo privilegio.\n– [mp.sw.1.r1.1] Las aplicaciones se desarrollarán respetando el principio de mínimo privilegio, accediendo únicamente a los recursos imprescindibles para su función, y con los privilegios que sean indispensables.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R2","nombre":"Metodología de desarrollo seguro","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Metodología de desarrollo seguro.\n– [mp.sw.1.r2.1] Se aplicará una metodología de desarrollo seguro reconocida que:\na) Tendrá en consideración los aspectos de seguridad a lo largo de todo el ciclo de vida.\nb) Incluirá normas de programación segura, especialmente: control de asignación y liberación de memoria, desbordamiento de memoria (overflow).\nc) Tratará específicamente los datos usados en pruebas.\nd) Permitirá la inspección del código fuente.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R3","nombre":"Seguridad desde el diseño","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Seguridad desde el diseño.\n– [mp.sw.1.r3.1] Los siguientes elementos serán parte integral del diseño del sistema:\na) Los mecanismos de identificación y autenticación.\nb) Los mecanismos de protección de la información tratada.\nc) La generación y tratamiento de pistas de auditoría.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R4","nombre":"Datos de pruebas","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Datos de pruebas.\n– [mp.sw.1.r4.1] Preferiblemente, las pruebas previas a la implantación o modificación de los sistemas de información no se realizarán con datos reales. En caso de que fuese necesario recurrir a datos reales se garantizará el nivel de seguridad correspondiente.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.2","medida":"Aceptación y puesta en servicio","refuerzo":"R1","nombre":"Pruebas","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1- Pruebas.\n– [mp.sw.2.r1.1] Las pruebas se realizarán en un entorno aislado (pre-producción).","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R1","nombre":"Certificados cualificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Certificados cualificados.\n– [mp.info.3.r1.1] Cuando se empleen sistemas de firma electrónica avanzada basados en certificados, estos serán cualificados.","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R2","nombre":"Algoritmos y parámetros autorizados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Algoritmos y parámetros autorizados.\n– [mp.info.3.r2.1] Se emplearán algoritmos y parámetros autorizados por el CCN o por un esquema nacional o europeo que resulte de aplicación.\nEl CCN determinará los algoritmos criptográficos que hayan sido autorizados nominalmente para su uso en el Esquema Nacional de Seguridad conforme a la Instrucción Técnica de Seguridad Criptología de empleo en el ENS.","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R3","nombre":"Verificación y validación de firma","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Verificación y validación de firma.\n– [mp.info.3.r3.1] Cuando proceda, se garantizará la verificación y validación de la firma electrónica durante el tiempo requerido por la actividad administrativa que aquélla soporte, sin perjuicio de que se pueda ampliar este período de acuerdo con lo que establezca la Política de Firma Electrónica y de Certificados que sea de aplicación. Para tal fin se adjuntará a la firma, o se referenciará, toda la información pertinente para su verificación y validación, incluyendo certificados o datos de verificación y validación.","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R4","nombre":"Firma electrónica avanzada basada en certificados cualificados","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Firma electrónica avanzada basada en certificados cualificados.\n– [mp.info.3.r4.1] Se usará firma electrónica avanzada basada en certificados cualificados complementada por un segundo factor del tipo «algo que se sabe» o «algo que se es».","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.6","medida":"Copias de seguridad","refuerzo":"R1","nombre":"Pruebas de recuperación","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Pruebas de recuperación.\n– [mp.info.6.r1.1] Los procedimientos de copia de seguridad y restauración deben probarse regularmente. Su frecuencia dependerá de la criticidad de los datos y del impacto que cause la falta de disponibilidad.","implementacion":"Dimensión D = ALTO → R1+R2 exigidos → cumplidos."},{"codigo":"mp.info.6","medida":"Copias de seguridad","refuerzo":"R2","nombre":"Protección de las copias de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Protección de las copias de seguridad.\n– [mp.info.6.r2.1] Al menos, una de las copias de seguridad se almacenará de forma separada en lugar diferente, de tal manera que un incidente no pueda afectar tanto al repositorio original como a la copia simultáneamente.","implementacion":"Dimensión D = ALTO → R1+R2 exigidos → cumplidos."},{"codigo":"mp.s.2","medida":"Protección de servicios y aplicaciones web","refuerzo":"R2","nombre":"Auditorías de seguridad avanzada","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Auditorías de seguridad avanzada.\n– [mp.s.2.r2.1] Se realizarán auditorías de seguridad de «caja blanca» sobre las aplicaciones web durante la fase de desarrollo.\n– [mp.s.2.r2.2] Se emplearán metodologías definidas y herramientas automáticas de detección de vulnerabilidades en la realización de las auditorías de seguridad sobre las aplicaciones web.\n– [mp.s.2.r2.3] Una vez finalizada una auditoría de seguridad, se analizarán los resultados y se solventarán las vulnerabilidades encontradas mediante los procedimientos definidos [op.exp.5].","implementacion":"R2+R3 exigidos en ALTO → cumplidos."},{"codigo":"mp.s.2","medida":"Protección de servicios y aplicaciones web","refuerzo":"R3","nombre":"Protección de las cachés","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Protección de las cachés.\n– [mp.s.2.r3.1] Se prevendrán ataques de manipulación de programas o dispositivos que realizan una acción en representación de otros, conocidos en terminología inglesa como \"proxies\" y, sistemas especiales de almacenamiento de alta velocidad, conocidos en terminología inglesa como \"cachés\".","implementacion":"R2+R3 exigidos en ALTO → cumplidos."},{"codigo":"mp.s.2","medida":"Protección de servicios y aplicaciones web","refuerzo":"R1","nombre":"Auditorías de seguridad","niveles":"BAJO/MEDIO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Auditorías de seguridad.\n– [mp.s.2.r1.1] Se realizarán auditorías continuas de seguridad de «caja negra» sobre las aplicaciones web durante la fase de desarrollo y antes de la fase de producción.\n– [mp.s.2.r1.2] La frecuencia de estas auditorías de seguridad quedará definida en el procedimiento de auditoría.","implementacion":"—"},{"codigo":"mp.s.3","medida":"Protección de la navegación web","refuerzo":"R1","nombre":"Monitorización","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1 - Monitorización.\n– [mp.s.3.r1.1] Se registrará el uso de la navegación web, estableciendo los elementos que se registran, el periodo de retención de estos registros y el uso que el organismo prevé hacer de ellos.\n– [mp.s.3.r1.2] Se establecerá una función para la ruptura de canales cifrados a fin de inspeccionar su contenido, indicando qué se analiza, qué se registra, durante cuánto tiempo se retienen los registros y qué uso prevé hacer el organismo de estas inspecciones. Todo ello sin perjuicio de que se puedan autorizar accesos cifrados singulares a destinos de confianza.\n– [mp.s.3.r1.3] Se establecerá una lista negra de destinos vetados.","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.s.4","medida":"Protección frente a denegación de servicio","refuerzo":"R1","nombre":"Detección y reacción","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Detección y reacción.\n– [mp.s.4.r1.1] Se establecerá un sistema de detección y tratamiento de ataques de denegación de servicio (DoS y DDoS).\n– [mp.s. 4.r1.2] Se establecerán procedimientos de reacción a los ataques, incluyendo la comunicación con el proveedor de comunicaciones.","implementacion":"Dimensión D = ALTO → R1 exigido → cumplido."}],"compensatorias":[{"id":"MC-01","medida":"op.pl.5 Componentes certificados","ambito":"Clúster de cortafuegos del CPD de respaldo (Tres Cantos): fabricante sin producto cualificado en el CPSTIC para la versión desplegada.","limitaciones":"El contrato de mantenimiento vence en 2027; la sustitución anticipada supone 180 k€ no presupuestados. El CPD de respaldo sólo está activo en contingencia.","objetivo":"Garantizar que la funcionalidad de seguridad del perímetro de respaldo ofrece garantías equivalentes a un producto cualificado (op.pl.5).","riesgo":"Vulnerabilidades no evaluadas en el firmware del cortafuegos; menor confianza en la robustez de la implementación (R-034 del AR-2026-01, riesgo residual MEDIO).","definicion":"1) Bastionado según guía del fabricante y CCN-STIC 600-series; 2) doble capa: IPS/IDS de producto cualificado (CPSTIC) delante del clúster; 3) escaneo de vulnerabilidades semanal y parcheo ≤72 h para críticas; 4) reglas exportadas y revisadas trimestralmente; 5) plan de sustitución aprobado por producto CPSTIC en 2027 (PTR-2026-11).","validacion":"Pentest anual externo sobre el perímetro de respaldo; prueba de conmutación del CPD (op.cont.3) incluye verificación de reglas; revisión del CSI 30/06/2026.","mantenimiento":"Revisión trimestral en el CSI; cierre al sustituir el equipo (fecha objetivo 30/06/2027).","aprobacion":"CSI – ACTA-CSI-2026-03; verificada por auditor en auditoría de certificación 2026"},{"id":"MC-02","medida":"mp.if.6 Protección frente a inundaciones","ambito":"CPD principal (Alcobendas): sala técnica en planta baja de edificio arrendado; no es posible reubicar la sala ni instalar drenaje perimetral por restricciones del arrendador.","limitaciones":"Contrato de arrendamiento hasta 2029; el propietario no autoriza obras estructurales.","objetivo":"Reducir la probabilidad e impacto de daño por agua a un nivel equivalente al exigido por [mp.if.6].","riesgo":"Inundación por rotura de conducción o lluvias torrenciales (amenaza [I.2]/[N.*] MAGERIT), R-051, riesgo inherente ALTO.","definicion":"1) Suelo técnico elevado 40 cm y racks sobre bancada; 2) sensores de agua bajo suelo técnico con alarma al SOC y al NOC; 3) válvulas de corte automático en conducciones que atraviesan la planta; 4) ausencia de canalizaciones de agua sobre la sala (certificado del arrendador); 5) CPD de respaldo con RTO 4 h que absorbe la pérdida total de la sala.","validacion":"Prueba semestral de sensores; inspección anual de la propiedad; simulacro de conmutación anual (REG-CONT-03).","mantenimiento":"Revisión anual y ante cualquier obra en el edificio; reevaluar en la renovación del arrendamiento (2029).","aprobacion":"CSI – ACTA-CSI-2026-03; verificada por auditor en auditoría de certificación 2026"},{"id":"MC-03","medida":"mp.com.3 R3 Dispositivos hardware (cifrado)","ambito":"Túneles IPsec site-to-site entre el tenant IaaS (NubeAdmin) y los CPD: el proveedor cloud no ofrece terminación en HSM/dispositivo hardware dedicado.","limitaciones":"Limitación técnica del proveedor cloud; la alternativa (línea dedicada MPLS con cifrador hardware) triplica el coste y no está prevista hasta 2027.","objetivo":"Proteger integridad y autenticidad de las comunicaciones al nivel exigido por [mp.com.3] R3 en categoría ALTA.","riesgo":"Compromiso del material criptográfico en la pasarela software del lado cloud (R-062, residual MEDIO).","definicion":"1) Terminación en los CPD sobre appliance cualificado CPSTIC (cumple R4) con claves en HSM; 2) lado cloud: pasarela con claves custodiadas en el KMS del proveedor con certificación ENS ALTA y rotación mensual; 3) algoritmos y parámetros CCN-STIC 807 (IKEv2, AES-256-GCM, SHA-384, DH grupo 19+); 4) doble capa: TLS 1.3 con mTLS extremo a extremo en las aplicaciones sobre el túnel.","validacion":"Auditoría de configuración anual (CCN-STIC 807); pruebas de intercepción en pentest; evidencia de rotación de claves.","mantenimiento":"Revisión anual; migració <script>

(function (root, factory) {

  const MATRIZ = [

    ['MB', 'B', 'B', 'M', 'A'],
    ['B', 'B', 'M', 'A', 'A'],
    ['B', 'M', 'A', 'A', 'MA'],
    ['M', 'A', 'A', 'MA', 'MA']

  const MADUREZ = {
    L0: { label: 'Inexistente', eficacia: 0.0 },
    L1: { label: 'Inicial / ad hoc', eficacia: 0.1 },
    L2: { label: 'Reproducible pero intuitivo', eficacia: 0.3 },

  const isBlank = (v) => v === null || v === undefined || String(v).trim() === '' || String(v).trim() === '—' || String(v).trim() === '-';
  const ENS_ALIAS = { B: 'BAJO', BAJ: 'BAJO', BAJA: 'BAJO', BASICA: 'BAJO', 'BÁSICA': 'BAJO', M: 'MEDIO', MED: 'MEDIO', MEDIA: 'MEDIO', ALT: 'ALTO', ALTA: 'ALTO' };
  function ensLevel(v) {
    if (isBlank(v)) return null;

  const maxEns = (a, b) => (!a ? b : !b ? a : (ENS_LV[a] >= ENS_LV[b] ? a : b));
  const maxNivel = (a, b) => (!a ? b : !b ? a : (NN[a] >= NN[b] ? a : b));
  const codeSort = (a, b) => {
    const order = ['org', 'op.pl', 'op.acc', 'op.ext', 'op.nub', 'op.exp', 'op.cont', 'op.mon', 'mp.if', 'mp.per', 'mp.eq', 'mp.com', 'mp.si', 'mp.sw', 'mp.info', 'mp.s'];
    const fam = (c) => c.replace(/\.\d+$/, '');
    const num = (c) => Number(c.match(/(\d+)$/)[1]);

  const FAMILIAS = {
    'org': 'Marco organizativo', 'op.pl': 'Planificación', 'op.acc': 'Control de acceso', 'op.ext': 'Recursos externos',
    'op.nub': 'Servicios en la nube', 'op.exp': 'Explotación', 'op.cont': 'Continuidad del servicio', 'op.mon': 'Monitorización del sistema',

    'mp.com': 'Protección de las comunicaciones', 'mp.si': 'Protección de los soportes de información', 'mp.sw': 'Protección de las aplicaciones informáticas',

  /* ---------- 1. Categorización (art. 40, Anexo I) ---------- */
  function nivelesSistema(activosEsenciales) {
    const niv = { D: null, I: null, C: null, A: null, T: null };
    const invalidos = [];
    for (const a of activosEsenciales || []) {
      for (const d of DIMS) {
        const l = ensLevel(a[d]);
        if (l === undefined) invalidos.push({ activo: a.id, nombre: a.nombre, dim: d, valor: a[d] });
        else if (l) niv[d] = maxEns(niv[d], l);

  }
  function categoria(niveles) {
    const vals = DIMS.map((d) => niveles[d]).filter(Boolean);
    if (vals.includes('ALTO')) return 'ALTA';
    if (vals.includes('MEDIO')) return 'MEDIA';
    return 'BÁSICA';
  }
  function dimsDe(dimsField) {
    if (!dimsField || dimsField === 'Categoría') return null;

  function nivelExigido(dimsField, niveles, cat) {

    const grupos = [];
    const sinGrupos = s.replace(/\[([^\]]+)\]/g, (_, g) => { grupos.push(g.split(/\s+o\s+/).map((x) => x.trim()).filter(Boolean)); return ''; });

  /* ---------- 2. MAGERIT (fórmulas de MAGERIT Lab v1.0) ---------- */
  const impacto = (valor, deg) => Math.round((Number(valor) || 0) * (Number(deg) || 0) / 100);
  function nivelDesdeImpacto(i) {
    if (i <= 0) return null;
    if (i <= 2) return 'B';
    if (i <= 5) return 'M';
    if (i <= 8) return 'A';

  const celda = (nivImp, prob) => MATRIZ[NN[nivImp] - 1][NN[prob] - 1];

  function riesgoInherente(activo, amenaza) {
    const out = {};
    for (const d of DIMS) {
      const ni = nivelDesdeImpacto(impacto(activo.valoracion?.[d], amenaza.deg?.[d]));
      out[d] = ni ? celda(ni, amenaza.prob) : null;

    return out;
  }
  function eficaciaCombinada(salvs, campo) {
    let f = 1;
    for (const s of salvs) {
      const eMad = (MADUREZ[s.madurez] || MADUREZ.L0).eficacia;
      f *= 1 - ((Number(s[campo]) || 0) / 100) * eMad;

  function riesgoResidual(activo, amenaza, salvs) {

    for (const d of DIMS) {
      const inh = impacto(activo.valoracion?.[d], amenaza.deg?.[d]);

  const CVSS_DEF = { ma: 9, a: 7, m: 4 };

  /* Amenazas efectivas: las declaradas en el AR + la evidencia de hallazgos técnicos abiertos. */
  function amenazasEfectivas(state, ctx, conHallazgos, cfg = {}) {
    const base = (state.amenazas || []).map((a) => ({ ...a, deg: { ...a.deg }, hallazgos: [] }));
    if (!conHallazgos) return base;
    for (const h of state.hallazgos || []) {

      const cat = ctx.mapping.hallazgo_categorias[h.categoria];
      if (!cat) continue;

  function registroRiesgos(state, ctx, conHallazgos = true, cfg = {}) {
    const ap = NN[state.apetito || 'M'];
    return amenazasEfectivas(state, ctx, conHallazgos, cfg).map((am) => {
      const act = (state.activos || []).find((a) => a.id === am.activoId) || { valoracion: {} };
      const salvs = salvaguardasDe(state, am);

      return { codigo: code, nombre: ax.nombre, familia: familiaDe(code), marco: marcoDe(code), dims: ax.dims, nivel, regla, exigencia: exig,
        aplicaNorma: pe.aplica, refuerzos: pe, decl, riesgos: rs, resMax, salvs, minMad, hallazgos: hall, justAuto };
    });
    const aplicables = filas.filter((f) => f.aplicaNorma);

      implantadas: aplicables.filter((f) => f.decl && /^implantada$/i.test(f.decl.estado || '') && pctDe(f.decl) >= 1).length,
      parciales: aplicables.filter((f) => f.decl && ESTADOS_PARCIALES.test(f.decl.estado || '')).length,
      compensadas: aplicables.filter((f) => /compensada/i.test(f.decl?.aplica || '')).length,
      grado: pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : 0,
      riesgos: riesgos.length,
      fueraApetito: riesgos.filter((r) => r.fueraApetito).length,
      fueraApetitoDeclarado: riesgosDeclarados.filter((r) => r.fueraApetito).length,
      hallazgosAbiertos: (state.hallazgos || []).filter((h) => h.estado === 'abierto').length,
      pendientes: aplicables.filter((f) => !f.decl || esPendiente(f.decl)).length
    };
    const porFamilia = {};
    for (const f of aplicables) {
      const k = f.familia; porFamilia[k] = porFamilia[k] || { familia: k, n: 0, suma: 0, prefijo: f.codigo.replace(/\.\d+$/, '') };
      porFamilia[k].n++; porFamilia[k].suma += f.decl ? pctDe(f.decl) : 0;
    }
    return { niveles, invalidos, categoria: cat, riesgos, riesgosDeclarados, filas, kpi,
      familias: Object.values(porFamilia).map((x) => ({ ...x, grado: x.suma / x.n })) };
  }

  /* ---------- 4. Auditor ---------- */
  function auditar(state, ctx, calc, opts = {}) {
    const out = [];
    const off = new Set(opts.reglasOff || []);
    const umbralMad = (MADUREZ[opts.madurezMin || 'L2'] || MADUREZ.L2).eficacia;
    const add = (id, sev, ambito, titulo, detalle, recomendacion, ref) => { if (!off.has(id)) out.push({ id, sev, ambito, titulo, detalle, recomendacion, ref }); };
    const pendientes = [];
    const hoy = opts.hoy ? new Date(opts.hoy) : new Date();

    // Categorización
    for (const inv of calc.invalidos) {
      const otrosAlto = (state.categorizacion || []).filter((a) => a.id !== inv.activo && ensLevel(a[inv.dim]) === 'ALTO').map((a) => a.id);
      const impactoTxt = otrosAlto.length
        ? `No altera el resultado: ${DIM_LABEL[inv.dim]} ya es ALTO por ${otrosAlto.join(', ')}.`
        : `Puede alterar el resultado: si el valor correcto fuera ALTO, ${DIM_LABEL[inv.dim]} pasaría de ${calc.niveles[inv.dim] || 'sin valorar'} a ALTO.`;
      add('CAT-01', SEV.MENOR, `${inv.activo} · ${inv.dim}`, 'Valor de categorización no válido',
        `El activo esencial ${inv.activo} (${inv.nombre}) tiene '${inv.valor}' en la dimensión ${DIM_LABEL[inv.dim]}. Solo se admiten BAJO, MEDIO o ALTO; la celda se ignora en el cálculo. ${impactoTxt}`,
        'Corregir la valoración con criterio del Responsable de la Información (CCN-STIC 803) y volver a aprobar la categorización en el CSI.', 'RD 311/2022, Anexo I');
    }
    for (const a of state.categorizacion || []) {
      if (DIMS.every((d) => isBlank(a[d]))) add('CAT-02', SEV.MAYOR, a.id, 'Activo esencial sin valorar', `${a.id} no tiene valoración en ninguna dimensión.`, 'Valorar las cinco dimensiones del activo esencial.', 'RD 311/2022, art. 40');
    }
    // SoA
    const mcs = state.compensatorias || [];
    const codigosEn = (txt) => String(txt || '').match(/\b(?:org\.\d+|(?:op|mp)\.[a-z]+\.\d+)\b/g) || [];
    const mcRefiere = (mc, code) => codigosEn(mc.medida).includes(code);
    for (const f of calc.filas) {
      const d = f.decl;
      if (!d) { add('SOA-03', SEV.MAYOR, f.codigo, 'Medida del Anexo II ausente en la SoA', `${f.codigo} ${f.nombre} no figura en la Declaración de Aplicabilidad.`, 'La SoA debe pronunciarse sobre las 73 medidas del Anexo II.', 'RD 311/2022, art. 28.2'); continue; }
      if (esPendiente(d)) { pendientes.push(f.codigo); continue; }
      const declAplica = aplicaDeclarada(d);
      if (f.aplicaNorma && !declAplica) add('SOA-01', SEV.MAYOR, f.codigo, 'Exclusión indebida',
        `${f.codigo} se declara NO aplicable, pero con nivel ${f.nivel} (${f.regla}) el Anexo II exige '${f.exigencia}'.`, 'Declarar la medida como aplicable e implantarla, o justificar una medida compensatoria (art. 28.3).', 'RD 311/2022, art. 28');
      if (!f.aplicaNorma && declAplica) add('SOA-02', SEV.OBS, f.codigo, 'Medida declarada aplicable sin exigencia normativa',
        `${f.codigo} no se exige en nivel ${f.nivel} ('n.a.'), pero la SoA la declara aplicable.`, 'Es admisible si responde al análisis de riesgos; dejarlo justificado.', 'RD 311/2022, art. 28.1');
      if (!f.aplicaNorma && !declAplica && isBlank(d.justificacion)) add('SOA-08', SEV.MENOR, f.codigo, 'Exclusión sin justificar', `${f.codigo} se excluye sin justificación documentada.`, 'Documentar el motivo de la exclusión.', 'RD 311/2022, art. 28.2');
      if (declAplica) {
        if (isBlank(d.evidencias)) add('SOA-04', SEV.MENOR, f.codigo, 'Medida aplicable sin evidencias', `${f.codigo} no referencia evidencias documentales.`, 'Enlazar procedimientos, registros o capturas que el auditor pueda verificar (CCN-STIC 808).', 'CCN-STIC 802/808');
        if (isBlank(d.responsable)) add('SOA-05', SEV.MENOR, f.codigo, 'Medida aplicable sin responsable', `${f.codigo} no tiene responsable asignado.`, 'Asignar un rol del art. 11 o del esquema de roles de la organización.', 'RD 311/2022, art. 11–13');
        const pct = pctDe(d);
        if (ESTADOS_PARCIALES.test(d.estado || '')) {
          const txt = [d.observaciones, d.evidencias, d.refuerzos_elegidos, d.mc_ref].join(' ');
          if (!/PTR|MC-\d+/i.test(txt)) add('SOA-06', SEV.MENOR, f.codigo, 'Implantación parcial sin plan de tratamiento', `${f.codigo} figura como '${d.estado}' sin acción PTR ni medida compensatoria referenciada.`, 'Registrar la acción pendiente en el Plan de Tratamiento de Riesgos con responsable y plazo.', 'RD 311/2022, art. 14');
          if (pct >= 1) add('SOA-07', SEV.MENOR, f.codigo, 'Porcentaje incoherente con el estado', `${f.codigo} está '${d.estado}' pero declara ${Math.round(pct * 100)} %.`, 'Alinear estado y porcentaje de implantación.', 'Buenas prácticas SoA');
        } else if (/^implantada$/i.test(d.estado || '') && pct < 1) add('SOA-07', SEV.MENOR, f.codigo, 'Porcentaje incoherente con el estado', `${f.codigo} está 'Implantada' pero declara ${Math.round(pct * 100)} %.`, 'Alinear estado y porcentaje de implantación.', 'Buenas prácticas SoA');
        if (/compensada/i.test(d.aplica || '') && !mcs.some((mc) => mcRefiere(mc, f.codigo))) add('MC-01', SEV.MAYOR, f.codigo, 'Medida compensada sin registro de medida compensatoria', `${f.codigo} se declara compensada pero ninguna MC del registro la sustituye.`, 'Registrar la medida compensatoria: ámbito, restricción, riesgo, medida, validación, mantenimiento y aprobación.', 'RD 311/2022, art. 28.3');
        // Refuerzos
        if (f.aplicaNorma) {
          const tabla = (state.refuerzos || []).filter((r) => r.codigo === f.codigo);
          for (const rn of f.refuerzos.obligatorios) {
            const row = tabla.find((r) => r.refuerzo === rn);
            if (!row || !/^s[ií]/i.test(String(row.exigible || ''))) add('REF-01', SEV.MAYOR, `${f.codigo} ${rn}`, 'Refuerzo exigido no contemplado',
              `Con nivel ${f.nivel}, ${f.codigo} exige ${rn}, pero la tabla de refuerzos ${row ? `lo marca como '${row.exigible}'` : 'no lo recoge'}.`, 'Incorporar el refuerzo a la implantación o justificar una medida compensatoria.', 'RD 311/2022, Anexo II');
          }
          for (const g of f.refuerzos.grupos) {
            const elegido = tabla.some((r) => g.includes(r.refuerzo) && /alternativa|s[ií]/i.test(String(r.exigible || '')) && !isBlank(r.implementacion));
            if (!elegido) add('REF-02', SEV.MENOR, `${f.codigo} [${g.join(' o ')}]`, 'Grupo de refuerzos alternativos sin opción elegida', `${f.codigo} exige al menos uno de ${g.join(', ')} y no consta cuál se ha implantado.`, 'Indicar la alternativa elegida y su implementación.', 'RD 311/2022, Anexo II');
          }
          const requeridos = new Set([...f.refuerzos.obligatorios, ...f.refuerzos.grupos.flat()]);
          for (const r of tabla) if (/^s[ií]/i.test(String(r.exigible || '')) && !requeridos.has(r.refuerzo)) add('REF-03', SEV.OBS, `${f.codigo} ${r.refuerzo}`, 'Refuerzo marcado exigible que ya no lo es',
            `Con nivel ${f.nivel}, ${f.codigo} no exige ${r.refuerzo}; la tabla lo sigue marcando como exigible.`, 'Actualizar la tabla de refuerzos tras la (re)categorización; mantenerlo es sobrecumplimiento admisible.', 'RD 311/2022, Anexo II');
        }
        // Coherencia con el análisis de riesgos
        if (/^implantada$/i.test(d.estado || '') && pct >= 1) {
          const debiles = f.salvs.filter((s) => (MADUREZ[s.madurez]?.eficacia ?? 0) <= umbralMad);
          if (debiles.length) add('AR-01', SEV.MAYOR, f.codigo, 'La SoA declara implantada una medida que el análisis de riesgos valora inmadura',
            `${f.codigo} figura 'Implantada' al 100 %, pero en el ${state.proyecto?.codigoAR || 'AR'} ${debiles.map((s) => `${s.codigo} (${s.nombre}) está en ${s.madurez} · ${MADUREZ[s.madurez].label}`).join('; ')}.`,
            'Revisar una de las dos fuentes: o se rebaja el estado en la SoA con acción PTR, o se actualiza la madurez de la salvaguarda con evidencias.', 'RD 311/2022, art. 28.1.c');
          for (const h of f.hallazgos) {
            const c = Number(h.cvss) || 0;
            if (c >= 4) add(c >= 7 ? 'PT-01' : 'PT-02', c >= 7 ? SEV.MAYOR : SEV.MENOR, f.codigo, 'Evidencia técnica contradice la SoA',
              `${f.codigo} figura 'Implantada' al 100 %, pero el hallazgo ${h.id} (${sevCvss(c)}, CVSS ${c}) sigue abierto: ${h.titulo}.`,
              'Corregir la vulnerabilidad y aportar evidencia del retest, o reflejar la implantación parcial en la SoA.', 'RD 311/2022, art. 8 y 31');
          }
        }
      }
    }
    // Registro de medidas compensatorias
    const idsRiesgo = new Set((state.amenazas || []).map((a) => a.id));
    for (const mc of mcs) {
      const faltan = ['validacion', 'mantenimiento', 'aprobacion', 'riesgo'].filter((k) => isBlank(mc[k]));
      if (faltan.length) add('MC-02', SEV.MENOR, mc.id, 'Medida compensatoria incompleta', `${mc.id} no documenta: ${faltan.join(', ')}.`, 'Completar la ficha de la medida compensatoria.', 'RD 311/2022, art. 28.3');
      const codesMc = codigosEn(mc.medida).filter((c) => ctx.anexo[c]);
      for (const c of codesMc) {
        const d = (state.soa || {})[c];
        if (d && !/compensada/i.test(d.aplica || '') && !/compensada/i.test(d.estado || '')) add('MC-03', SEV.OBS, mc.id, 'Medida compensatoria no reflejada en la SoA', `${mc.id} sustituye a ${c}, pero la SoA no la marca como compensada.`, 'Marcar la medida como SÍ (compensada) y referenciar la MC.', 'RD 311/2022, art. 28.3');
      }
      const rids = String(mc.riesgo || '').match(/\bR-\d{3}\b/g) || [];
      for (const rid of rids) if (!idsRiesgo.has(rid)) add('MC-04', SEV.MENOR, mc.id, 'Riesgo citado en la MC no existe en el análisis de riesgos', `${mc.id} cita ${rid}, que no figura en el ${state.proyecto?.codigoAR || 'AR'}.`, 'Dar de alta el riesgo en el AR o corregir la referencia.', 'RD 311/2022, art. 28.3');
    }
    // Análisis de riesgos
    for (const r of calc.riesgos) {
      if (!r.fueraApetito) continue;
      const t = r.tratamiento;
      if (!t) add('AR-02', SEV.MENOR, r.amenaza.id, 'Riesgo fuera de apetito sin tratamiento', `${r.amenaza.id} ${r.amenaza.nombre} sobre ${r.activo.nombre}: residual ${r.resMax}, apetito ${state.apetito}${r.amenaza.hallazgos?.length ? ` (riesgo nuevo aflorado por ${r.amenaza.hallazgos.join(', ')})` : ''}.`, 'Decidir tratamiento (mitigar, transferir, evitar o aceptar formalmente).', 'RD 311/2022, art. 14');
      else if (t.opcion === 'aceptar') add('AR-02', SEV.MENOR, r.amenaza.id, 'Riesgo por encima del apetito aceptado', `${r.amenaza.id} ${r.amenaza.nombre} se acepta con residual ${r.resMax} (apetito ${state.apetito})${r.amenaza.hallazgos?.length ? `; el hallazgo ${r.amenaza.hallazgos.join(', ')} lo ha elevado desde la aceptación original` : ''}.`, 'Requiere aprobación formal del Responsable de la Información y constancia en acta del CSI.', 'RD 311/2022, art. 14');
      else if (isBlank(t.plazo) || isBlank(t.responsable)) add('AR-03', SEV.OBS, r.amenaza.id, 'Tratamiento sin plazo o responsable', `${r.amenaza.id}: '${t.opcion}' sin ${isBlank(t.plazo) ? 'plazo' : 'responsable'}.`, 'Completar el Plan de Tratamiento de Riesgos.', 'RD 311/2022, art. 14');
    }
    if (pendientes.length) add('SOA-10', SEV.OBS, `${pendientes.length} medidas`, 'Medidas pendientes de declarar',
      `La SoA aún no se pronuncia sobre: ${pendientes.join(', ')}.`, 'Completar aplicabilidad, estado, evidencias y responsable de cada medida.', 'RD 311/2022, art. 28.2');
    const sinRiesgo = calc.filas.filter((f) => f.aplicaNorma && !f.riesgos.length && !pendientes.includes(f.codigo)).map((f) => f.codigo);
    if (sinRiesgo.length) add('AR-04', SEV.OBS, `${sinRiesgo.length} medidas`, 'Medidas aplicables sin riesgo vinculado en el AR',
      `No hay ningún riesgo del análisis que se trate con: ${sinRiesgo.join(', ')}.`, 'Ampliar el inventario de activos y amenazas del AR o documentar que son exigencias de base.', 'RD 311/2022, art. 28.1.c');
    for (const a of state.activos || []) if (!a.soporta || !a.soporta.length) add('AR-05', SEV.OBS, a.id, 'Activo del AR sin vínculo a activos esenciales', `${a.id} ${a.nombre} no indica qué servicios o información esencial soporta.`, 'Relacionar el activo con los activos esenciales valorados en la categorización.', 'MAGERIT v3, Libro I §3.1');
    // Documento
    const p = state.portada || {};
    if (isBlank(p['Firma (art. 28.2 RD 311/2022)'])) add('DOC-01', SEV.MENOR, 'Portada', 'SoA sin firma', 'La Declaración de Aplicabilidad no consta firmada por la Responsable de Seguridad.', 'Firmar electrónicamente la SoA.', 'RD 311/2022, art. 28.2');
    const fe = String(p['Fecha de emisión'] || '').match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (fe) { const dte = new Date(+fe[3], +fe[2] - 1, +fe[1]); if ((hoy - dte) / 864e5 > 365) add('DOC-02', SEV.MENOR, 'Portada', 'SoA sin revisar en los últimos 12 meses', `Fecha de emisión ${fe[0]}.`, 'Revisar la SoA al menos anualmente.', 'RD 311/2022, art. 28.2'); }
    return out.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || a.id.localeCompare(b.id) || String(a.ambito).localeCompare(String(b.ambito), 'es', { numeric: true }));
  }

  /* ---------- 5. Plan de acción (derivado + estado del usuario) ---------- */
  function planAccion(state, calc, audit) {
    const acc = state.acciones || {};
    const pri = { 'NC mayor': 'Alta', 'NC menor': 'Media' };
    const out = [];
    const push = (a) => { const u = acc[a.key] || {}; out.push({ ...a, estado: u.estado || 'Pendiente', responsable: u.responsable ?? a.responsable ?? '', fecha: u.fecha ?? a.fecha ?? '', nota: u.nota || '' }); };
    for (const h of state.hallazgos || []) {
      if (h.estado !== 'abierto' || (Number(h.cvss) || 0) < 4) continue;
      push({ key: 'H|' + h.id, origen: 'Evidencia técnica', ref: h.id, prioridad: Number(h.cvss) >= 7 ? 'Alta' : 'Media', titulo: `Corregir ${h.id}: ${h.titulo}`, detalle: 'Corregir la vulnerabilidad y aportar evidencia del retest para cerrar las no conformidades asociadas.', responsable: 'Responsable del Sistema' });
    }
    for (const r of calc.riesgos) {
      if (!r.fueraApetito) continue;
      const t = r.tratamiento || {};
      push({ key: 'R|' + r.amenaza.id, origen: 'Análisis de riesgos', ref: r.amenaza.id, prioridad: NN[r.resMax] >= 5 ? 'Alta' : 'Media',
        titulo: `${t.opcion ? t.opcion[0].toUpperCase() + t.opcion.slice(1) : 'Tratar'} ${r.amenaza.id}: ${r.amenaza.nombre} (${r.activo.nombre || r.amenaza.activoId})`,
        detalle: `Residual ${r.resMax} frente a un apetito ${state.apetito}.`, responsable: t.responsable || '', fecha: t.plazo || '' });
    }
    for (const f of audit) {
      if (!pri[f.sev] || /^PT-|^AR-02$/.test(f.id)) continue;
      push({ key: `NC|${f.id}|${f.ambito}`, origen: 'Auditoría', ref: `${f.id} · ${f.ambito}`, prioridad: pri[f.sev], titulo: f.titulo + ' · ' + f.ambito, detalle: f.recomendacion, responsable: '' });
    }
    const vivas = new Set(out.map((a) => a.key));
    for (const [key, u] of Object.entries(acc)) if (!vivas.has(key) && u.titulo) out.push({ key, origen: u.origen || '', ref: u.ref || '', prioridad: '—', titulo: u.titulo, detalle: 'El origen ya no aparece: la herramienta lo da por verificado.', estado: 'Verificada', responsable: u.responsable || '', fecha: u.fecha || '', nota: u.nota || '', verificada: true });
    const ord = { Alta: 0, Media: 1, '—': 2 };
    return out.sort((a, b) => (a.estado === 'Hecha' || a.verificada) - (b.estado === 'Hecha' || b.verificada) || ord[a.prioridad] - ord[b.prioridad] || String(a.fecha || '9').localeCompare(String(b.fecha || '9')));
  }
  function instantanea(calc, audit) {
    return { grado: calc.kpi.grado, ncMayor: audit.filter((f) => f.sev === SEV.MAYOR).length, ncMenor: audit.filter((f) => f.sev === SEV.MENOR).length, fuera: calc.kpi.fueraApetito };
  }

  return { CVSS_DEF, esPendiente, planAccion, instantanea, DIMS, DIM_LABEL, ENS_LEVELS, NIVELES, NN, NIVEL_LABEL, MATRIZ, MADUREZ, SEV, FAMILIAS,
    isBlank, ensLevel, codeSort, familiaDe, marcoDe, nivelesSistema, categoria, nivelExigido, parseExigencia,
    impacto, nivelDesdeImpacto, riesgoInherente, riesgoResidual, riesgoMax, eficaciaCombinada, probDesdeCvss, sevCvss,
    amenazasEfectivas, registroRiesgos, tratamientoSugerido, pctDe, aplicaDeclarada, calcular, auditar };
});

function tr(s) {
  if (s == null || lang() !== 'en') return s;
  const raw = String(s);
  const key = raw.trim();
  if (!key) return raw;
  if (Object.prototype.hasOwnProperty.call(EN, key)) {
    const i = raw.indexOf(key);
    return raw.slice(0, i) + EN[key] + raw.slice(i + key.length);
  }
  for (let i = 0; i < EN_RE.length; i++) {
    const re = EN_RE[i][0];
    if (re.test(key)) {
      const next = key.replace(re, EN_RE[i][1]); // string o función
      const at = raw.indexOf(key);
      return raw.slice(0, at) + next + raw.slice(at + key.length);
    }
  }
  return raw;
}

function translateDom(root) {
  if (!root || lang() !== 'en') return;
  const textSkip = root.querySelectorAll('script, style, textarea, .f-t, .f-d, .f-r, .f-ref');
  const blocked = new Set();
  textSkip.forEach((el) => { blocked.add(el); el.querySelectorAll('*').forEach((n) => blocked.add(n)); });
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const n of nodes) {
    if (n.parentElement && blocked.has(n.parentElement)) continue;
    const next = tr(n.nodeValue);
    if (next !== n.nodeValue) n.nodeValue = next;
  }
  root.querySelectorAll('[placeholder], [aria-label], [title]').forEach((el) => {
    if (el.closest('script, style, .f-t, .f-d, .f-r, .f-ref')) return;
    for (const attr of ['placeholder', 'aria-label', 'title']) {
      if (!el.hasAttribute(attr)) continue;
      const next = tr(el.getAttribute(attr));
      if (next !== el.getAttribute(attr)) el.setAttribute(attr, next);
    }
  });
}

function localize() {
  if (lang() !== 'en') return;
  for (const id of ['side', 'top', 'view', 'palette', 'toast']) {
    const el = document.getElementById(id);
    if (el) translateDom(el);
  }
}

function paletteItems() {
  const q = ui.paletteQ.trim().toLowerCase();

  const V = [['inicio', 'Inicio', 'home'], ['panel', 'Panel', 'dashboard'], ['categorizacion', 'Categorización', 'layers'], ['riesgos', 'Análisis de riesgos', 'activity'], ['soa', 'Declaración de Aplicabilidad', 'fileCheck'], ['compensatorias', 'Medidas compensatorias', 'scale'], ['hallazgos', 'Evidencia técnica', 'target'], ['plan', 'Plan de acción', 'listChecks'], ['auditoria', 'Auditoría', 'shieldCheck'], ['exportar', 'Exportar', 'download'], ['ayuda', 'Ayuda', 'help'], ['ajustes', 'Ajustes', 'sliders'], ['perfil', 'Perfil', 'user'], ['nuevo', 'Nuevo proyecto', 'plus']];
  for (const [v, l, ic] of V) if (state || !PROJECT_VIEWS.includes(v)) items.push({ grupo: 'Ir a', label: l, ic, act: () => go(v) });
  if (state) {
    items.push({ grupo: 'Acciones', label: 'Descargar la SoA en Excel', ic: 'sheet', act: () => exportXlsx() });
    items.push({ grupo: 'Acciones', label: 'Descargar el informe de auditoría', ic: 'download', act: () => saveFile(`${slug()}_informe_preauditoria_${today()}.md`, informeMd()) });
  }
  items.push({ grupo: 'Acciones', label: 'Cambiar entre tema claro y oscuro', ic: 'moon', act: () => { ws.settings.tema = document.documentElement.getAttribute('data-theme') === 'dark' || (ws.settings.tema === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'claro' : 'oscuro'; saveWs(); applyTheme(); render(); } });
  for (const c of D.casos) items.push({ grupo: 'Casos de ejemplo', label: `Abrir ${c.titulo}`, ic: caseIcon(c.id), act: () => openCase(c.id) });
  if (state) {
    for (const f of calc.filas) items.push({ grupo: 'Medidas', label: `${f.codigo} · ${f.nombre}`, ic: 'fileCheck', act: () => gotoSoa(f.codigo), hint: f.aplicaNorma ? f.nivel : 'no exigida' });
    for (const r of calc.riesgos) items.push({ grupo: 'Riesgos', label: `${r.amenaza.id} · ${r.amenaza.nombre} — ${r.activo.nombre || ''}`, ic: 'activity', act: () => { ui.riesgosTab = 'registro'; go('riesgos'); }, hint: r.resMax || '' });
  }
  const blob = (it) => (it.label + ' ' + it.grupo + ' ' + tr(it.label) + ' ' + tr(it.grupo)).toLowerCase();
  const res = q ? items.filter((it) => blob(it).includes(q)) : items.filter((it) => it.grupo !== 'Medidas' && it.grupo !== 'Riesgos');
  return res.slice(0, 40);
}
function renderPalette() {
  const host = $('#palette');

  const items = paletteItems(); ui._pItems = items;
  if (ui.paletteIdx >= items.length) ui.paletteIdx = Math.max(0, items.length - 1);
  let last = ''; let html = '';
  items.forEach((it, i) => {
    if (it.grupo !== last) { html += `<div class="pal-group">${esc(it.grupo)}</div>`; last = it.grupo; }
    html += `<button type="button" class="pal-item${i === ui.paletteIdx ? ' on' : ''}" data-act="pal-run" data-i="${i}" id="pal-${i}">${icon(it.ic, 16)}<span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</button>`;
  });
  const wasOpen = !host.hidden;

    host.innerHTML = `<div class="overlay" data-act="pal-close"></div><div class="palette" role="dialog" aria-label="Buscar"><div class="pal-in">${icon('search', 18)}<input id="pal-q" type="text" placeholder="Busca una medida (op.acc.6), un riesgo, una sección o una acción…" value="${esc(ui.paletteQ)}" autocomplete="off"><kbd>Esc</kbd></div><div class="pal-list" id="pal-list"></div></div>`;

function calc0Preview(w) {
  const { niveles } = E.nivelesSistema(w.activos); const cat = E.categoria(niveles); let aplicables = 0, oblig = 0, alt = 0;

  return { aplicables, oblig, alt };
}

/* ---------- Vistas del proyecto ---------- */
function kpiTile(label, value, sub, opts = {}) {
  const d = opts.delta;
  const delta = d === undefined || d === null || d === 0 ? '' : `<span class="delta ${(opts.goodDown ? d < 0 : d > 0) ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'} ${opts.fmt ? opts.fmt(Math.abs(d)) : Math.abs(d)}</span>`;
  return `<div class="kpi${opts.alert ? ' alert' : ''}"><span class="kpi-l">${opts.ic ? icon(opts.ic, 16) : ''}${label}</span><span class="kpi-v num">${value}${delta}</span><span class="kpi-s">${sub}</span></div>`;
}
function evolucion() {
  const h = (state.historial || []).slice(-8);
  if (h.length < 2) return emptyState('clock', 'La evolución aparecerá aquí', 'Cada día que trabajes en el proyecto se guarda una instantánea de las no conformidades.');
  const W = 560, H = 190, P = { l: 30, r: 8, t: 12, b: 26 };
  const max = Math.max(4, ...h.map((x) => x.ncMayor + x.ncMenor));
  const step = Math.ceil(max / 4); const top = step * 4;
  const bw = (W - P.l - P.r) / h.length; const y = (v) => P.t + (H - P.t - P.b) * (1 - v / top);
  let g = '';
  for (let i = 0; i <= 4; i++) { const v = step * i; g += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(v)}" y2="${y(v)}" class="grid-l"/><text x="${P.l - 6}" y="${y(v) + 3.5}" class="ax-t" text-anchor="end">${v}</text>`; }
  h.forEach((s, i) => {
    const x = P.l + i * bw + bw * 0.22, w = bw * 0.56;
    const y1 = y(s.ncMayor), y2 = y(s.ncMayor + s.ncMenor);
    const lab = new Date(s.fecha + 'T00:00:00').toLocaleDateString(locale(), { day: 'numeric', month: 'short' });
    g += `<g class="bar-g" data-tip="${esc(lab)} · ${plural(s.ncMayor, 'NC mayor', 'NC mayores')} · ${plural(s.ncMenor, 'NC menor', 'NC menores')} · implantación ${pct(s.grado, 0)}">
      <rect x="${x - bw * 0.2}" y="${P.t}" width="${bw * 0.96}" height="${H - P.t - P.b}" class="hit"/>
      <path d="M${x},${y(0)} V${y1 + 2} a2,2 0 0 1 2,-2 H${x + w - 2} a2,2 0 0 1 2,2 V${y(0)} Z" class="s-mayor"/>
      ${s.ncMenor ? `<path d="M${x},${y1 - 2} V${y2 + 3} a3,3 0 0 1 3,-3 H${x + w - 3} a3,3 0 0 1 3,3 V${y1 - 2} Z" class="s-menor"/>` : ''}
      <text x="${x + w / 2}" y="${H - 8}" class="ax-t" text-anchor="middle">${lab}</text></g>`;
  });
  const ejemplo = h.some((x) => x.ejemplo);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Evolución de no conformidades">${g}</svg>
    <div class="legend"><span><i class="lg s-mayor"></i>NC mayores</span><span><i class="lg s-menor"></i>NC menores</span>${ejemplo ? '<span class="muted small">· incluye historial de ejemplo</span>' : ''}</div>`;
}

/* --- SoA --- */
function soaFiltered() {
  const q = ui.soaQ.trim().toLowerCase();
  const incid = new Set(audit.map((f) => String(f.ambito).split(' ')[0]));
  return calc.filas.filter((f) => {
    if (ui.soaMarco !== 'todos' && !f.codigo.startsWith(ui.soaMarco)) return false;
    const d = f.decl || {};
    if (ui.soaEstado === 'aplicables' && !f.aplicaNorma) return false;
    if (ui.soaEstado === 'noaplica' && f.aplicaNorma) return false;
    if (ui.soaEstado === 'incidencias' && !incid.has(f.codigo)) return false;
    if (ui.soaEstado === 'pendientes' && !(f.aplicaNorma && E.esPendiente(d))) return false;
    if (ui.soaEstado === 'parciales' && !/parcial|compensada|planificad/i.test((d.estado || '') + (d.aplica || ''))) return false;
    if (q && !(`${f.codigo} ${f.nombre} ${f.familia} ${d.responsable || ''} ${D.anexo[f.codigo].iso27001}`.toLowerCase().includes(q))) return false;
    return true;
  });
}
function vSoa() {
  const list = soaFiltered();
  const famGrade = Object.fromEntries(calc.familias.map((f) => [f.familia, f.grado]));
  let html = ''; let lastFam = '';

    if (f.familia !== lastFam) { lastFam = f.familia; html += `<div class="fam-sep"><span>${esc(f.familia)}</span><code>${f.codigo.replace(/\.\d+$/, '')} · ${famGrade[f.familia] !== undefined ? Math.round(famGrade[f.familia] * 100) + ' %' : 'n.a.'}</code></div>`; }
    const d = f.decl || {}; const p = E.pctDe(d); const fs = findingsFor(f.codigo); const open = ui.soaOpen === f.codigo;
    const worst = fs.find((x) => x.sev === 'NC mayor') ? 'crit' : fs.find((x) => x.sev === 'NC menor') ? 'warn' : fs.length ? 'accent' : '';
    html += `<div class="soa-row${open ? ' open' : ''}${!f.aplicaNorma ? ' na' : ''}" data-act="soa-toggle" data-code="${esc(f.codigo)}" role="button" tabindex="0" aria-expanded="${open}" id="soa-${esc(f.codigo)}">
      <code class="s-code">${esc(f.codigo)}</code>
      <span class="s-name">${esc(f.nombre)}</span>
      <span class="s-dim">${dimsChips(f.dims)}<small>${f.nivel[0] + f.nivel.slice(1).toLowerCase()}</small></span>
      <span class="s-exig" title="Exigencia del Anexo II en nivel ${f.nivel}"><code>${esc(f.exigencia)}</code></span>
      <span class="s-state">${estadoBadge(f.decl, f.aplicaNorma)}${E.aplicaDeclarada(d) && !E.esPendiente(d) ? `<span class="pbar"><span class="bar"><i class="${p < 1 ? 'part' : ''}" style="width:${Math.round(p * 100)}%"></i></span><span class="num">${Math.round(p * 100)}%</span></span>` : ''}</span>
      <span class="s-risk">${f.riesgos.length ? riskChip(f.resMax, `${plural(f.riesgos.length, 'riesgo vinculado', 'riesgos vinculados')}; residual máximo`) + `<small>×${f.riesgos.length}</small>` : '<small class="muted">—</small>'}</span>
      <span class="s-flags">${f.hallazgos.length ? `<span class="badge warn" title="Hallazgos técnicos abiertos">${icon('target', 13)}${f.hallazgos.length}</span>` : ''}${fs.length ? `<span class="badge ${worst}">${fs.length}</span>` : '<span class="ok-dot" title="Sin incidencias">' + icon('check', 14) + '</span>'}</span>
      <span class="s-chev">${icon('chevronDown', 16)}</span>
    </div>`;
    if (open) html += soaDetail(f, fs);
  }
  const pend = calc.filas.filter((f) => f.aplicaNorma && E.esPendiente(f.decl)).length;
  return `${pageHead('RD 311/2022 · art. 28 y Anexo II', 'Declaración de Aplicabilidad', 'El nivel exigido, la exigencia y los refuerzos se calculan desde la categorización. La aplicabilidad, el estado y las evidencias son lo que declaras. Cada medida muestra qué riesgos trata y qué objeta el auditor.',
    `<button type="button" class="btn" data-act="export-xlsx">${icon('sheet', 16)}Exportar</button>`)}
  <div class="toolbar sticky">
    <div class="search-in">${icon('search', 16)}<input type="search" id="soa-q" data-uiq="soaQ" value="${esc(ui.soaQ)}" placeholder="Código, medida, responsable o control ISO…" aria-label="Buscar en la SoA"></div>
    <div class="seg" role="group" aria-label="Marco">${[['todos', 'Todas'], ['org', 'org'], ['op', 'op'], ['mp', 'mp']].map(([v, l]) => `<button type="button" data-act="soa-marco" data-v="${v}" aria-pressed="${ui.soaMarco === v}">${l}</button>`).join('')}</div>
    <select id="soa-estado" data-ui="soaEstado" aria-label="Filtro">${[['todos', 'Todas las medidas'], ['aplicables', 'Exigidas'], ['incidencias', 'Con incidencias'], ['pendientes', `Pendientes (${pend})`], ['parciales', 'Parciales o compensadas'], ['noaplica', 'No exigidas']].map(([v, l]) => opt(v, l, ui.soaEstado)).join('')}</select>
    <span class="muted small">${list.length} de 73</span></div>
  <div class="soa-list">
    <div class="soa-row soa-head"><span>Código</span><span>Medida</span><span>Dimensión · nivel</span><span class="s-exig">Exigencia</span><span class="s-state">Estado</span><span class="s-risk">Riesgo</span><span class="s-flags">Auditor</span><span></span></div>
    ${html || emptyState('search', 'Nada coincide', 'Prueba con otro filtro o término de búsqueda.')}</div>`;

/* --- Compensatorias --- */

  const campos = [['medida', 'Medida o refuerzo sustituido'], ['ambito', 'Ámbito de aplicación'], ['limitaciones', 'Limitaciones o restricciones'], ['objetivo', 'Objetivo de la medida original'], ['riesgo', 'Riesgo identificado'], ['definicion', 'Medidas compensatorias'], ['validacion', 'Validación'], ['mantenimiento', 'Mantenimiento y revisión'], ['aprobacion', 'Aprobación']];
  const cards = state.compensatorias.map((mc, i) => {
    const rids = String(mc.riesgo || '').match(/\bR-\d{3}\b/g) || [];
    const fs = audit.filter((f) => f.ambito === mc.id);
    return `<article class="card mc"><div class="card-head"><div class="row"><span class="mc-id">${esc(mc.id)}</span><h3>${esc(String(mc.medida || 'Nueva medida compensatoria').slice(0, 90))}</h3></div>
      <div class="row">${rids.map((r) => reg.get(r) ? `<span class="chip" title="${esc(reg.get(r).amenaza.nombre)}">${esc(r)} ${riskChip(reg.get(r).resMax)}</span>` : `<span class="badge crit">${esc(r)} no está en el AR</span>`).join('')}
      <button type="button" class="icon-btn sm" data-act="del-mc" data-i="${i}" aria-label="Eliminar">${icon('trash', 16)}</button></div></div>
      <div class="form-grid">${campos.map(([k, l]) => `<label class="fld${k === 'definicion' ? ' span2' : ''}">${l}<textarea id="mc-${i}-${k}" data-set="compensatorias.${i}.${k}">${esc(mc[k] || '')}</textarea></label>`).join('')}</div>
      ${fs.length ? `<div class="findings" style="margin-top:14px">${fs.map((x) => findingCard(x)).join('')}</div>` : ''}</article>`;
  }).join('');
  return `${pageHead('RD 311/2022 · art. 28.3', 'Medidas compensatorias', 'Cuando una medida no puede implantarse como describe el Anexo II, se sustituye por otras que protejan igual o mejor, justificadas documentalmente. Los riesgos citados se enlazan con el análisis y muestran su residual actual.',

  ${cards || `<div class="card">${emptyState('scale', 'Sin medidas compensatorias', 'Si alguna medida no puede implantarse tal cual, documenta aquí cómo se compensa.')}</div>`}`;
}

/* --- Evidencia técnica --- */
function vHall() {
  const reg = E.registroRiesgos(state, CTX, true, { cvss: ws.settings.cvss });

async function saveFile(filename, data) {
  try {
    const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename, data }); toast(`Guardado: ${filename}`); return; }
  } catch (e) {
    if (e && e.code === 'declined') { toast('Descarga cancelada'); return; }
    if (e && e.code === 'rate_limited') { toast('Ya hay una descarga pendiente de confirmar'); return; }
    if (e && e.code && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { toast(`No se pudo guardar: ${e.message || e.code}`); return; }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast(`Descargado: ${filename}`);
}

function setPath(obj, path, value) {
  let ks = path.split('.');
  if (ks[0] === 'soa') ks = ['soa', ks.slice(1, -1).join('.'), ks[ks.length - 1]]; // los códigos ENS contienen puntos
  let o = obj;
  if (ks.some((k) => BAD_KEYS.has(k))) return; // defensa ante prototype pollution
  for (let i = 0; i < ks.length - 1; i++) { const k = ks[i]; if (!Object.prototype.hasOwnProperty.call(o, k) || o[k] === null || typeof o[k] !== 'object') o[k] = {}; o = o[k]; }
  o[ks[ks.length - 1]] = typeof value === 'string' ? s(value) : value;
}
function readVal(el) {
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.type === 'num') v = v === '' ? 0 : Number(v);
  if (el.dataset.type === 'pct') v = v === '' ? null : Math.max(0, Math.min(100, Number(v))) / 100;
  if (el.dataset.type === 'list') v = String(v).split(/[,;\s]+/).map((x) => x.trim()).filter(Boolean);
  if (el.dataset.type === 'bool') v = !!el.checked;
  return v;
}

}
