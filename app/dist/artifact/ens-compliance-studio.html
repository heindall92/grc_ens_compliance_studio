ial","pct":0.8,"evidencias":"Contrato SOC; informes TI; informe pentest 2026; plan de despliegue analítica DL-01","responsable":"SOC (SecOps Iberia) / Resp. Seguridad","refuerzos_elegidos":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos.","observaciones":null},"org.1":{"aplica":"SÍ","justificacion":"APLICA: medida exigida para la categoría ALTA del sistema (afecta a todas las dimensiones). Exigencia: 'aplica'. Riesgos tratados según AR-2026-01. CCN-STIC 808: 10 requisitos de verificación (6 esenciales).","org":"Política de Seguridad de la Información PSI-01 v4 aprobada por el Consejo de Administración (30/01/2026) y adherida por las tres consejerías; define misión, marco legal (ENS, RGPD/LOPDGDD, LGT, Ley 39/2015, contratos), roles (Resp. Información/Servicio/Sistema/Seguridad, DPD), Comité de Seguridad, estructura documental y revisión anual.","tec":"Publicación en la intranet con control de versiones (DMS); firma electrónica del acta de aprobación.","mc_ref":"—","estado":"Implantada","pct":1,"evidencias":"PSI-01; ACTA-CA-2026-01; REG-COM-04 (difusión); nombramientos NOM-01..05","responsable":"Responsable de Seguridad","refuerzos_elegidos":"Revisión anual (próxima 01/2027).","observaciones":null},"op.pl.5":{"aplica":"SÍ (compensada)","justificacion":"APLICA: medida exigida para la categoría ALTA del sistema (afecta a todas las dimensiones). Exigencia: 'aplica'. Riesgos tratados según AR-2026-01. CCN-STIC 808: 4 requisitos de verificación (2 esenciales).","org":"Política de uso de productos cualificados (CPSTIC) en op.pl.3; inventario de componentes de seguridad con su estado de cualificación; plan de sustitución.","tec":"Cortafuegos, VPN, EDR, HSM y cifradores del CPD principal son productos cualificados CPSTIC; excepción documentada para el clúster de cortafuegos del CPD de respaldo.","mc_ref":"MC-01","estado":"Parcial (compensada)","pct":0.85,"evidencias":"INV-SEC-01 (componentes de seguridad y cualificación); MC-01","responsable":"Responsable de Seguridad","refuerzos_elegidos":"Ver medida compensatoria MC-01 (sustitución 2027, PTR-2026-11).","observaciones":null},"mp.if.6":{"aplica":"SÍ (compensada)","justificacion":"APLICA: medida vinculada a la(s) dimensión(es) D; nivel exigido ALTO (máx(D=ALTO) = ALTO). Exigencia: 'aplica'. Riesgos tratados según AR-2026-01. CCN-STIC 808: 3 requisitos de verificación (0 esenciales).","org":"Evaluación del riesgo de inundación; medidas compensatorias documentadas para el CPD principal (planta baja); CPD de respaldo en planta 2 sin riesgo.","tec":"Suelo técnico elevado, sensores de agua, válvulas de corte, ausencia de conducciones sobre la sala.","mc_ref":"MC-02","estado":"Parcial (compensada)","pct":0.9,"evidencias":"MC-02; informe de riesgo hidráulico; REG-MANT-SENS","responsable":"Facilities / Resp. del Sistema","refuerzos_elegidos":"Ver medida compensatoria MC-02.","observaciones":null}},"refuerzos":[{"codigo":"op.pl.1","medida":"Análisis de riesgos","refuerzo":"R2","nombre":"Análisis de riesgos formal","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Análisis de riesgos formal.\nSe deberá realizar un análisis formal, usando un lenguaje específico, con un fundamento matemático reconocido internacionalmente, que:\n– [op.pl.1.r2.1] Valore cualitativamente los activos más valiosos del sistema.\n– [op.pl.1.r2.2] Cuantifique las amenazas posibles.\n– [op.pl.1.r2.3] Valore y priorice las salvaguardas adecuadas.\n– [op.pl.1.r2.4] Valore y asuma formalmente el riesgo residual.","implementacion":"R2 análisis formal exigido en ALTA → cumplido (PILAR, modo formal)."},{"codigo":"op.pl.1","medida":"Análisis de riesgos","refuerzo":"R1","nombre":"Análisis de riesgos semiformal","niveles":"MEDIO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Análisis de riesgos semiformal.\nSe deberá realizar un análisis de riesgos semiformal, usando un lenguaje específico, con un catálogo básico de amenazas y una semántica definida. Es decir, una presentación con tablas que:\n– [op.pl.1.r1.1] Valore cualitativamente los activos más valiosos del sistema.\n– [op.pl.1.r1.2] Cuantifique las amenazas más probables.\n– [op.pl.1.r1.3] Valore las salvaguardas que protegen de dichas amenazas.\n– [op.pl.1.r1.4] Valore el riesgo residual.","implementacion":"—"},{"codigo":"op.pl.2","medida":"Arquitectura de Seguridad","refuerzo":"R1","nombre":"Sistema de gestión","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Sistema de gestión.\n[op.pl.2.r1.1] Sistema de gestión, relativo a la planificación, organización y control de los recursos relativos a la seguridad de la información.","implementacion":"R1+R2+R3 exigidos en ALTA → cumplidos."},{"codigo":"op.pl.2","medida":"Arquitectura de Seguridad","refuerzo":"R2","nombre":"Sistema de gestión de la seguridad con mejora continua","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Sistema de gestión de la seguridad con mejora continua.\n[op.pl.2.r2.1] Sistema de gestión de la seguridad de la información, con actualización y aprobación periódica.","implementacion":"R1+R2+R3 exigidos en ALTA → cumplidos."},{"codigo":"op.pl.2","medida":"Arquitectura de Seguridad","refuerzo":"R3","nombre":"Validación de datos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Validación de datos.\n[op.pl.2.r3.1] Controles técnicos internos, incluyendo la validación de datos de entrada, salida y datos intermedios.","implementacion":"R1+R2+R3 exigidos en ALTA → cumplidos."},{"codigo":"op.pl.4","medida":"Dimensionamiento/gestión de la capacidad","refuerzo":"R1","nombre":"Mejora continua de la gestión de la capacidad","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1 –Mejora continua de la gestión de la capacidad.\n– [op.pl.4.r1.1] Se realizará una previsión de la capacidad y se mantendrá actualizada durante todo el ciclo de vida del sistema.\n– [op.pl.4.r1.2] Se emplearán herramientas y recursos para la monitorización de la capacidad.","implementacion":"Dimensión D = ALTO → R1 exigido → cumplido."},{"codigo":"op.acc.1","medida":"Identificación","refuerzo":"R1","nombre":"Identificación avanzada","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Identificación avanzada.\n– [op.acc.1.r1.1] La identificación del usuario permitirá al Responsable del Sistema, al Responsable de la Seguridad o a sus respectivos administradores delegados, singularizar a la persona asociada al mismo, así como sus responsabilidades en el sistema.\n– [op.acc.1.r1.2] Los datos de identificación serán utilizados por el sistema para determinar los privilegios del usuario conforme a los requisitos de control de acceso establecidos en la documentación de seguridad.\n– [op.acc.1.r1.3] Se asegurará la existencia de una lista actualizada de usuarios autorizados y mantenida por el administrador del sistema/de la seguridad del sistema.","implementacion":"Dimensiones T (MEDIO) y A (ALTO) → nivel ALTO → R1 exigido → cumplido."},{"codigo":"op.acc.2","medida":"Requisitos de acceso","refuerzo":"R1","nombre":"Privilegios de acceso","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Privilegios de acceso.\n– [op.acc.2.r1.1] Todos los usuarios autorizados deben tener un conjunto de atributos de seguridad (privilegios) que puedan ser mantenidos individualmente.\n– [op.acc.2.r1.2] Los privilegios de acceso se implementarán para restringir el tipo de acceso que un usuario puede tener (lectura, escritura, modificación, borrado, etc.).","implementacion":"R1 Privilegios de acceso exigido en ALTO → cumplido."},{"codigo":"op.acc.3","medida":"Segregación de funciones y tareas","refuerzo":"R1","nombre":"Segregación rigurosa","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Segregación rigurosa.\n– [op.acc.3.r1.1] Siempre que sea posible, la misma persona no aunará funciones de configuración y mantenimiento del sistema.\n– [op.acc.3.r1.2] La misma persona no puede aunar funciones de auditoría o supervisión con cualquier otra función.","implementacion":null},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R2","nombre":"Contraseña + OTP","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R2-Contraseña + OTP.\n– [op.acc.5.r2.1] Se requerirá una contraseña de un solo uso (OTP, en inglés) como complemento a la contraseña de usuario.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R3","nombre":"Certificados","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R3-Certificados.\n– [op.acc.5.r3.1] Se emplearán certificados cualificados como mecanismo de autenticación.\n– [op.acc.5.r3.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.\n– [op.acc.5.r3.3] Las credenciales utilizadas deberán haber sido obtenidas tras un registro previo presencial, o bien telemático, usando un certificado electrónico cualificado.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R4","nombre":"Certificados en dispositivo físico","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R4-Certificados en dispositivo físico.\n– [op.acc.5.r4.1] Se emplearán certificados cualificados como mecanismo de autenticación, en soporte físico (tarjeta o similar) usando algoritmos, parámetros y dispositivos autorizados por el CCN.\n– [op.acc.5.r4.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.\n– [op.acc.5.r4.3] Las credenciales utilizadas deberán haber sido obtenidas tras un registro previo presencial, o bien telemático, usando certificado electrónico cualificado.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R5","nombre":"Registro","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R5-Registro.\n– [op.acc.5.r5.1] Se registrarán los accesos con éxito y los fallidos.\n– [op.acc.5.r5.2] Se informará al usuario del último acceso efectuado con su identidad.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R1","nombre":"Contraseñas","niveles":"BAJO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Contraseñas.\n– [op.acc.5.r1.1] Se empleará una contraseña como mecanismo de autenticación.\n– [op.acc.5.r1.2] Se impondrán normas de complejidad mínima y robustez frente a ataques de adivinación (ver guías CCN-STIC).","implementacion":"—"},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R1","nombre":"Contraseñas","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R1-Contraseñas.\n– [op.acc.6.r1.1] Se empleará una contraseña como mecanismo de autenticación cuando el acceso se realiza desde zonas controladas y sin atravesar zonas no controladas (véase refuerzo R8).\n– [op.acc.6.r1.2] Se impondrán normas de complejidad mínima y robustez frente a ataques de adivinación (ver guías CCN-STIC).","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R2","nombre":"Contraseña + otro factor de autenticación","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R2-Contraseña + otro factor de autenticación.\n– [op.acc.6.r2.1] Se requerirá un segundo factor tal como «algo que se tiene», es decir, un dispositivo, una contraseña de un solo uso (OTP, en inglés) como complemento a la contraseña de usuario, o «algo que se es».","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R3","nombre":"Certificados","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R3-Certificados.\n– [op.acc.6.r3.1] Se emplearán certificados cualificados como mecanismo de autenticación.\n– [op.acc.6.r3.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R4","nombre":"Certificados en dispositivo físico","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R4-Certificados en dispositivo físico.\n– [op.acc.6.r4.1] Se emplearán certificados cualificados como mecanismo de autenticación, en soporte físico (tarjeta o similar) usando algoritmos, parámetros y dispositivos autorizados por el CCN.\n– [op.acc.6.r4.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R5","nombre":"Registro","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R5-Registro.\n– [op.acc.6.r5.1] Se registrarán los accesos con éxito y los fallidos.\n– [op.acc.6.r5.2] Se informará al usuario del último acceso efectuado con su identidad.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R6","nombre":"Limitación de la ventana de acceso","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R6-Limitación de la ventana de acceso.\n– [op.acc.6.r6.1] Se definirán aquellos puntos en los que el sistema requerirá una renovación de la autenticación del usuario, mediante identificación singular, no bastando con la sesión establecida.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R7","nombre":"Suspensión por no utilización","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R7-Suspensión por no utilización.\n– [op.acc.6.r7.1] Las credenciales se suspenderán tras un periodo definido de no utilización.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R8","nombre":"Doble factor para acceso desde o a través de zonas no controladas","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R8-Doble factor para acceso desde o a través de zonas no controladas.\nSe denomina «zona controlada» aquella que no es de acceso público, requiriéndose que el usuario, antes de tener acceso al equipo, se haya autenticado previamente de alguna forma (control de acceso a las instalaciones), diferente del mecanismo de autenticación lógica frente al sistema. Un ejemplo de zona no controlada es Internet.\n– [op.acc.6.r8.1] Para el acceso desde o a través de zonas no controladas se requerirá un doble factor de autenticación: R2, R3 o R4.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R9","nombre":"Acceso remoto (todos los niveles)","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R9-Acceso remoto (todos los niveles).\n– [op.acc.6.r9.1] Será de aplicación la ITS de Interconexión de sistemas de información.\n– [op.acc.6.r9.2] El acceso remoto deberá considerar los siguientes aspectos:\na) Ser autorizado por la autoridad correspondiente.\nb) El tráfico deberá ser cifrado.\nc) Si la utilización no se produce de manera constante, el acceso remoto deberá encontrarse inhabilitado y habilitarse únicamente cuando sea necesario.\nd) Deberán recogerse registros de auditoría de este tipo de conexiones.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.exp.3","medida":"Gestión de la configuración de seguridad","refuerzo":"R1","nombre":"Mantenimiento regular de la configuración","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Mantenimiento regular de la configuración.\n– [op.exp.3.r1.1] Existirán configuraciones hardware/software, autorizadas y mantenidas regularmente, para los servidores, elementos de red y estaciones de trabajo.\n– [op.exp.3.r1.2] Se verificará periódicamente la configuración hardware/software del sistema para asegurar que no se han introducido ni instalado elementos no autorizados.\n– [op.exp.3.r1.3] Se mantendrá una lista de servicios autorizados para servidores y estaciones de trabajo.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.3","medida":"Gestión de la configuración de seguridad","refuerzo":"R2","nombre":"Responsabilidad de la configuración","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Responsabilidad de la configuración.\n– [op.exp.3.r2.1] La configuración de seguridad del sistema operativo y aplicaciones, tanto de estaciones y servidores como de la electrónica de red del sistema, será responsabilidad de un número muy limitado de administradores del sistema.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.3","medida":"Gestión de la configuración de seguridad","refuerzo":"R3","nombre":"Copias de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Copias de seguridad.\n– [op.exp.3.r3.1] Se realizarán copias de seguridad de la configuración del sistema de forma que sea posible reconstruirlo en parte o en su totalidad tras un incidente.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.4","medida":"Mantenimiento y actualizaciones de seguridad","refuerzo":"R1","nombre":"Pruebas en preproducción","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Pruebas en preproducción.\n[op.exp.4.r1.1] Antes de poner en producción una nueva versión o una versión parcheada, se comprobará en un entorno de prueba controlado y consistente en configuración al entorno de producción, que la nueva instalación funciona correctamente y no disminuye la eficacia de las funciones necesarias para el trabajo diario.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.exp.4","medida":"Mantenimiento y actualizaciones de seguridad","refuerzo":"R2","nombre":"Prevención de fallos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Prevención de fallos.\n[op.exp.4.r2.1] Antes de la aplicación de las configuraciones, parches y actualizaciones de seguridad se preverá un mecanismo para revertirlos en caso de aparición de efectos adversos.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.exp.5","medida":"Gestión de cambios","refuerzo":"R1","nombre":"Prevención de fallos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Prevención de fallos.\n– [op.exp.5.r1.1] Antes de la aplicación de los cambios, se deberá tener en cuenta la posibilidad de revertirlos en caso de la aparición de efectos adversos.\n– [op.exp.5.r1.2] Todos los fallos en el software y hardware deberán ser comunicados al responsable designado en la organización de la seguridad.\n– [op.exp.5.r1.3] Todos los cambios en el sistema deberán documentarse, incluyendo una valoración del impacto que dicho cambio supone en la seguridad del sistema.","implementacion":null},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R1","nombre":"Escaneo periódico","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Escaneo periódico.\n– [op.exp.6.r1.1] Todo el sistema se escaneará regularmente para detectar código dañino.","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R2","nombre":"Revisión preventiva del sistema","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Revisión preventiva del sistema.\n– [op.exp.6.r2.1] Las funciones críticas se analizarán al arrancar el sistema en prevención de modificaciones no autorizadas.","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R3","nombre":"Lista blanca","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3 - Lista blanca.\n– [op.exp.6.r3.1] Solamente se podrán ejecutar aquellas aplicaciones previamente autorizadas. Se implementará una lista blanca para impedir la ejecución de aplicaciones no autorizadas.","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R4","nombre":"Capacidad de respuesta en caso de incidente","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Capacidad de respuesta en caso de incidente.\n– [op.exp.6.r4.1] Se emplearán herramientas de seguridad orientadas a detectar, investigar y resolver actividades sospechosas en puestos de usuario y servidores (EDR - Endpoint Detection and Response).","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.7","medida":"Gestión de incidentes","refuerzo":"R1","nombre":"Notificación","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Notificación.\n– [op.exp.7.r1.1] Se dispondrá de soluciones de ventanilla única para la notificación de incidentes al CCN-CERT, que permita la distribución de notificaciones a las diferentes entidades de manera federada, utilizando para ello dependencias administrativas jerárquicas.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.7","medida":"Gestión de incidentes","refuerzo":"R2","nombre":"Detección y Respuesta","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2 –Detección y Respuesta.\nEl proceso integral para hacer frente a los incidentes que puedan tener un impacto en la seguridad del sistema ([op.exp.7.1]) deberá incluir:\n– [op.exp.7.r2.1] Implantación de medidas urgentes, incluyendo la detención de servicios, el aislamiento del sistema afectado, la recogida de evidencias y protección de los registros, según convenga al caso.\n– [op.exp.7.r2.2] Asignación de recursos para investigar las causas, analizar las consecuencias y resolver el incidente.\n– [op.exp.7.r2.3] Informar del incidente a los responsables de la información y servicios afectados y de las actuaciones llevadas a cabo para su resolución.\n– [op.exp.7.r2.4] Medidas para:\na) Prevenir que se repita el incidente.\nb) Incluir en los procedimientos de usuario la identificación y forma de tratar el incidente.\nc) Actualizar, extender, mejorar u optimizar los procedimientos de resolución de incidentes.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.7","medida":"Gestión de incidentes","refuerzo":"R3","nombre":"Reconfiguración dinámica","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Reconfiguración dinámica.\nLa reconfiguración dinámica del sistema persigue detener, desviar o limitar ataques, acotando los daños.\n– [op.exp.7.r3.1] La reconfiguración dinámica incluye, por ejemplo, cambios en las reglas de los enrutadores (routers), listas de control de acceso, parámetros del sistema de detección / prevención de intrusiones y reglas en los cortafuegos y puertas de enlace, aislamiento de elementos críticos y aislamiento de las copias de seguridad.\n– [op.exp.7.r3.2] El organismo adaptará los procedimientos de reconfiguración dinámica reaccionando a los anuncios recibidos del CCN-CERT relativos a ciberamenazas sofisticadas y campañas de ataques.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R1","nombre":"Revisión de los registros","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R1-Revisión de los registros.\n– [op.exp.8.r1.1] Se revisarán informalmente, de forma periódica, los registros de actividad, buscando patrones anormales.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R2","nombre":"Sincronización del reloj del sistema","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R2-Sincronización del reloj del sistema.\n– [op.exp.8.r2.1] El sistema deberá disponer de una referencia de tiempo (timestamp) para facilitar las funciones de registro de eventos y auditoría. La modificación de la referencia de tiempo del sistema será una función de administración y, en caso de realizarse su sincronización con otros dispositivos, deberán utilizarse mecanismos de autenticación e integridad.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R3","nombre":"Retención de registros","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R3-Retención de registros.\n– [op.exp.8.r3.1] En la documentación de seguridad del sistema se deberán indicar los eventos de seguridad que serán auditados y el tiempo de retención de los registros antes de ser eliminados.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R4","nombre":"Control de acceso","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R4-Control de acceso.\n– [op.exp.8.r4.1] Los registros de actividad y, en su caso, las copias de seguridad de los mismos, solamente podrán ser accedidos o eliminarse por personal debidamente autorizado.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R5","nombre":"Revisión automática y correlación de eventos","niveles":"ALTO","nivel_exigido":"MEDIO","exigible":"No","texto":"R5-Revisión automática y correlación de eventos.\n– [op.exp.8.r5.1] El sistema deberá implementar herramientas para analizar y revisar la actividad del sistema y la información de auditoría, en búsqueda de comprometimientos de la seguridad posibles o reales.\n– [op.exp.8.r5.2] Se dispondrá de un sistema automático de recolección de registros, correlación de eventos y respuesta automática ante los mismos.","implementacion":"—"},{"codigo":"op.exp.10","medida":"Protección de claves criptográficas","refuerzo":"R1","nombre":"Algoritmos autorizados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Algoritmos autorizados.\n– [op.exp.10.r1.1] Se emplearán algoritmos y parámetros autorizados por el CCN.","implementacion":"R1 exigido → cumplido."},{"codigo":"op.ext.4","medida":"Interconexión de sistemas","refuerzo":"R1","nombre":"Coordinación de actividades","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Coordinación de actividades.\n– [op.ext.4.r1.1] Cuando se interconecten sistemas en los que la identificación, autenticación y autorización tengan lugar en diferentes dominios de seguridad, bajo distintas responsabilidades, las medidas de seguridad locales se acompañarán de los correspondientes mecanismos y procedimientos de coordinación para la atribución y ejercicio efectivos de las responsabilidades de cada sistema.","implementacion":"R1 exigido → cumplido."},{"codigo":"op.nub.1","medida":"Protección de servicios en la nube","refuerzo":"R1","nombre":"Servicios certificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1- Servicios certificados.\n– [op.nub.1.r1.1] Cuando se utilicen servicios en la nube suministrados por terceros, estos deberán estar certificados bajo una metodología de certificación reconocida por el Organismo de Certificación del Esquema Nacional de Evaluación y Certificación de Seguridad de las Tecnologías de la Información.\n– [op.nub.1.r1.2] Si el servicio en la nube es un servicio de seguridad deberá cumplir con los requisitos establecidos en [op.pl.5].","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.nub.1","medida":"Protección de servicios en la nube","refuerzo":"R2","nombre":"Guías de Configuración de Seguridad Específicas","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Guías de Configuración de Seguridad Específicas.\n– [op.nub.1.r2.1] La configuración de seguridad de los sistemas que proporcionan estos servicios deberá realizarse según la correspondiente guía CCN-STIC de Configuración de Seguridad Específica, orientadas tanto al usuario como al proveedor.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.1","medida":"Detección de intrusión","refuerzo":"R1","nombre":"Detección basada en reglas","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Detección basada en reglas.\n– [op.mon.1.r1.1] El sistema dispondrá de herramientas de detección o prevención de intrusiones basadas en reglas.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.1","medida":"Detección de intrusión","refuerzo":"R2","nombre":"Procedimientos de respuesta","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Procedimientos de respuesta.\n– [op.mon.1.r2.1] Existirán procedimientos de respuesta a las alertas generadas por el sistema de detección o prevención de intrusiones.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.2","medida":"Sistema de métricas","refuerzo":"R1","nombre":"Efectividad del sistema de gestión de incidentes","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Efectividad del sistema de gestión de incidentes.\n– [op.mon.2.r1.1] Se recopilarán los datos precisos que posibiliten evaluar el comportamiento del sistema de gestión de incidentes, de acuerdo con la Instrucción Técnica de Seguridad de Notificación de Incidentes de Seguridad y con la correspondiente guía CCN-STIC.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.2","medida":"Sistema de métricas","refuerzo":"R2","nombre":"Eficiencia del sistema de gestión de la seguridad","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Eficiencia del sistema de gestión de la seguridad.\n– [op.mon.2.r2.1] Se recopilarán los datos precisos para conocer la eficiencia del sistema de seguridad, en relación con los recursos consumidos, en términos de horas y presupuesto.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R1","nombre":"Correlación de eventos","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Correlación de eventos.\n– [op.mon.3.r1.1] Se dispondrá de un sistema automático de recolección de eventos de seguridad que permita la correlación de los mismos.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R2","nombre":"Análisis dinámico","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Análisis dinámico.\n– [op.mon.3.r2.1] Se dispondrá de soluciones de vigilancia que permitan determinar la superficie de exposición con relación a vulnerabilidades y deficiencias de configuración.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R3","nombre":"Ciberamenazas avanzadas","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Ciberamenazas avanzadas.\n– [op.mon.3.r3.1] Se dispondrá de sistemas para detección de amenazas avanzadas y comportamientos anómalos.\n– [op.mon.3.r3.2] Se dispondrá de sistemas para la detección de amenazas persistentes avanzadas (Advanced Persistent Threat, APT) mediante la detección de anomalías significativas en el tráfico de la red.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R4","nombre":"Observatorios digitales","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Observatorios digitales.\n– [op.mon.3.r4.1] Se dispondrá de observatorios digitales con fines de cibervigilancia dedicados a la detección y seguimiento de anomalías que pudieran representar indicadores de amenaza en contenidos digitales.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R5","nombre":"Minería de datos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R5-Minería de datos.\nSe aplicarán medidas para prevenir, detectar y reaccionar frente a intentos de minería de datos:\n– [op.mon.3.r5.1] Limitación de las consultas, monitorizando volumen y frecuencia.\n– [op.mon.3.r5.2] Alerta a los administradores de seguridad de comportamientos sospechosos en tiempo real.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R6","nombre":"Inspecciones de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R6-Inspecciones de seguridad.\nPeriódicamente, o tras incidentes que hayan desvelado vulnerabilidades del sistema nuevas o subestimadas, se realizarán las siguientes inspecciones:\n– [op.mon.3.r6.1] Verificación de configuración.\n– [op.mon.3.r6.2] Análisis de vulnerabilidades.\n– [op.mon.3.r6.3] Pruebas de penetración.","implementacion":"R5 minería de datos en despliegue (data lake) → PTR-2026-07, fecha objetivo 31/12/2026. R1-R4 y R6 cumplidos."},{"codigo":"mp.if.4","medida":"Energía eléctrica","refuerzo":"R1","nombre":"Suministro eléctrico de emergencia","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Suministro eléctrico de emergencia.\n– [mp.if.4.r1.1] En caso de fallo del suministro principal, el abastecimiento eléctrico deberá estar garantizado durante el tiempo suficiente para una terminación ordenada de los procesos y la salvaguarda de la información.","implementacion":"Dimensión D = ALTO → R1 exigido → cumplido."},{"codigo":"mp.per.2","medida":"Deberes y obligaciones","refuerzo":"R1","nombre":"Confirmación expresa","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Confirmación expresa.\n– [mp.per.2.r1.1] Se ha de obtener la confirmación expresa de que los usuarios conocen las instrucciones de seguridad necesarias y obligatorias y su aceptación, así como los procedimientos necesarios para llevarlas a cabo de manera adecuada.","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.eq.1","medida":"Puesto de trabajo despejado","refuerzo":"R1","nombre":"Almacenamiento del material","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Almacenamiento del material.\n– [mp.eq.1.r1.1] Una vez usado, y siempre que sea factible, el material se almacenará en lugar cerrado.","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.eq.2","medida":"Bloqueo de puesto de trabajo","refuerzo":"R1","nombre":"Cierre de sesiones","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Cierre de sesiones.\n– [mp.eq.2.r1.1] Pasado un cierto tiempo, superior al anterior, se cancelarán las sesiones abiertas desde dicho puesto de trabajo.\nUna Guía CCN-STIC concretará la implementación de la configuración de seguridad adaptada a la categorización del sistema o perfil de cumplimiento asociado.","implementacion":"Dimensión A = ALTO → R1 exigido → cumplido."},{"codigo":"mp.eq.3","medida":"Protección de dispositivos portátiles","refuerzo":"R1","nombre":"Cifrado del disco","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1– Cifrado del disco.\n– [mp.eq.3.r1.1] Se protegerá el dispositivo portátil mediante cifrado del disco duro cuando el nivel de confidencialidad de la información almacenada en el mismo sea de nivel MEDIO.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"mp.eq.3","medida":"Protección de dispositivos portátiles","refuerzo":"R2","nombre":"Entornos protegidos","niveles":"AL ntacion":"Alternativa elegida: R2 (segmentación lógica avanzada) + R4; R3 físico adicional para gestión. Cumple '[R2 o R3] + R4'."},{"codigo":"mp.com.4","medida":"Separación de flujos de información en la red","refuerzo":"R3","nombre":"Segmentación física","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R3-Segmentación física.\n– [mp.com.4.r3.1] Los segmentos de red se implementarán con medios físicos separados.","implementacion":"Alternativa elegida: R2 (segmentación lógica avanzada) + R4; R3 físico adicional para gestión. Cumple '[R2 o R3] + R4'."},{"codigo":"mp.com.4","medida":"Separación de flujos de información en la red","refuerzo":"R4","nombre":"Puntos de interconexión","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Puntos de interconexión.\n– [mp.com.4.r4.1] Control de entrada de los usuarios que llegan a cada segmento y control de entrada y salida de la información disponible en cada segmento.\n– [mp.com.4.r4.2] El punto de interconexión estará particularmente asegurado, mantenido y monitorizado, (como en [mp.com.1]).","implementacion":"Alternativa elegida: R2 (segmentación lógica avanzada) + R4; R3 físico adicional para gestión. Cumple '[R2 o R3] + R4'."},{"codigo":"mp.com.4","medida":"Separación de flujos de información en la red","refuerzo":"R1","nombre":"Segmentación lógica básica","niveles":"MEDIO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Segmentación lógica básica.\n– [mp.com.4.r1.1] Los segmentos de red se implementarán por medio de redes de área local virtuales (Virtual Local Area Network, VLAN).\n– [mp.com.4.r1.2] La red que conforma el sistema deberá segregarse en distintas subredes contemplando como mínimo:\n• Usuarios.\n• Servicios.\n• Administración.","implementacion":"—"},{"codigo":"mp.si.2","medida":"Criptografía","refuerzo":"R1","nombre":"Productos certificados","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1– Productos certificados.\n– [mp.si.2.r1.1] Se emplearán productos certificados conforme a lo establecido en [op.pl.5].","implementacion":"R1 productos certificados para cintas → medida compensatoria MC-04; R2 cumplido."},{"codigo":"mp.si.2","medida":"Criptografía","refuerzo":"R2","nombre":"Copias de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Copias de seguridad.\n– [mp.si.2.r2.1] Las copias se seguridad se cifrarán utilizando algoritmos y parámetros autorizados por el CCN.","implementacion":"R1 productos certificados para cintas → medida compensatoria MC-04; R2 cumplido."},{"codigo":"mp.si.5","medida":"Borrado y destrucción","refuerzo":"R1","nombre":"Productos certificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Productos certificados.\n– [mp.si.5.r1.1] Se usarán productos o servicios que cumplan lo establecido en [op.pl.5].","implementacion":"Dimensión C = ALTO → R1 exigido → cumplido."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R1","nombre":"Mínimo privilegio","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Mínimo privilegio.\n– [mp.sw.1.r1.1] Las aplicaciones se desarrollarán respetando el principio de mínimo privilegio, accediendo únicamente a los recursos imprescindibles para su función, y con los privilegios que sean indispensables.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R2","nombre":"Metodología de desarrollo seguro","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Metodología de desarrollo seguro.\n– [mp.sw.1.r2.1] Se aplicará una metodología de desarrollo seguro reconocida que:\na) Tendrá en consideración los aspectos de seguridad a lo largo de todo el ciclo de vida.\nb) Incluirá normas de programación segura, especialmente: control de asignación y liberación de memoria, desbordamiento de memoria (overflow).\nc) Tratará específicamente los datos usados en pruebas.\nd) Permitirá la inspección del código fuente.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R3","nombre":"Seguridad desde el diseño","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Seguridad desde el diseño.\n– [mp.sw.1.r3.1] Los siguientes elementos serán parte integral del diseño del sistema:\na) Los mecanismos de identificación y autenticación.\nb) Los mecanismos de protección de la información tratada.\nc) La generación y tratamiento de pistas de auditoría.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.1","medida":"Desarrollo de aplicaciones","refuerzo":"R4","nombre":"Datos de pruebas","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Datos de pruebas.\n– [mp.sw.1.r4.1] Preferiblemente, las pruebas previas a la implantación o modificación de los sistemas de información no se realizarán con datos reales. En caso de que fuese necesario recurrir a datos reales se garantizará el nivel de seguridad correspondiente.","implementacion":"R1+R2+R3+R4 exigidos. R3: modelado de amenazas completado en S-01 y S-04; pendiente S-02/S-03 (PTR-2026-09, 30/11/2026)."},{"codigo":"mp.sw.2","medida":"Aceptación y puesta en servicio","refuerzo":"R1","nombre":"Pruebas","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1- Pruebas.\n– [mp.sw.2.r1.1] Las pruebas se realizarán en un entorno aislado (pre-producción).","implementacion":"R1 exigido → cumplido."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R1","nombre":"Certificados cualificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Certificados cualificados.\n– [mp.info.3.r1.1] Cuando se empleen sistemas de firma electrónica avanzada basados en certificados, estos serán cualificados.","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R2","nombre":"Algoritmos y parámetros autorizados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Algoritmos y parámetros autorizados.\n– [mp.info.3.r2.1] Se emplearán algoritmos y parámetros autorizados por el CCN o por un esquema nacional o europeo que resulte de aplicación.\nEl CCN determinará los algoritmos criptográficos que hayan sido autorizados nominalmente para su uso en el Esquema Nacional de Seguridad conforme a la Instrucción Técnica de Seguridad Criptología de empleo en el ENS.","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R3","nombre":"Verificación y validación de firma","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Verificación y validación de firma.\n– [mp.info.3.r3.1] Cuando proceda, se garantizará la verificación y validación de la firma electrónica durante el tiempo requerido por la actividad administrativa que aquélla soporte, sin perjuicio de que se pueda ampliar este período de acuerdo con lo que establezca la Política de Firma Electrónica y de Certificados que sea de aplicación. Para tal fin se adjuntará a la firma, o se referenciará, toda la información pertinente para su verificación y validación, incluyendo certificados o datos de verificación y validación.","implementacion":"Dimensiones I/A = ALTO → R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"mp.info.3","medida":"Firma electrónica","refuerzo":"R4","nombre":"Firma electrónica avanzada basada en certificados cualificados","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Firma electrónica avanzada basada en certificados cualificados.\n– [mp.in .exp.5].","implementacion":"R2+R3 exigidos en ALTO → cumplidos."},{"codigo":"mp.s.2","medida":"Protección de servicios y aplicaciones web","refuerzo":"R3","nombre":"Protección de las cachés","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Protección de las cachés.\n– [mp.s.2.r3.1] Se prevendrán ataques de manipulación de programas o dispositivos que realizan una acción en representación de otros, conocidos en terminología inglesa como \"proxies\" y, sistemas especiales de almacenamiento de alta velocidad, conocidos en terminología inglesa como \"cachés\".","implementacion":"R2+R3 exigidos en ALTO → cumplidos."},{"codigo":"mp.s.2","medida":"Protección de servicios y aplicaciones web","refuerzo":"R1","nombre":"Auditorías de seguridad","niveles":"BAJO/MEDIO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Auditorías de seguridad.\n– [mp.s.2.r1.1] Se realizarán auditorías continuas de seguridad de «caja negra» sobre las aplicaciones web durante la fase de desarrollo y antes de la fase de producción.\n– [mp.s.2.r1.2] La frecuencia de estas auditorías de seguridad quedará definida en el procedimiento de auditoría.","implementacion":"—"},{"codigo":"mp.s.3","medida":"Protección de la navegación web","refuerzo":"R1","nombre":"Monitorización","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1 - Monitorización.\n– [mp.s.3.r1.1] Se registrará el uso de la navegación web, estableciendo los elementos que se registran, el periodo de retención de estos registros y el uso que el organismo prevé hacer de ellos.\n– [mp.s.3.r1.2] Se establecerá una función para la ruptura de canales cifrados a fin de inspeccionar su contenido, indicando qué se analiza, qué se registra, durante cuánto tiempo se retienen los registros y qué uso prevé hacer el organismo de estas inspecciones. Todo ello sin perjuicio de que se puedan autorizar accesos cifrados singulares a destinos de confianza.\n– [mp.s.3.r1.3] Se establecerá una lista negra de destinos vetados.","i a baja); CPD de respaldo en planta 2 sin riesgo.","tec":"Suelo técnico elevado, sensores de agua, válvulas de corte, ausencia de conducciones sobre la sala.","mc_ref":"MC-02","estado":"Parcial (compensada)","pct":0.9,"evidencias":"MC-02; informe de riesgo hidráulico; REG-MANT-SENS","responsable":"Facilities / Resp. del Sistema","refuerzos_elegidos":"Ver medida compensatoria MC-02.","observaciones":null}},"refuerzos":[{"codigo":"op.pl.1","medida":"Análisis de riesgos","refuerzo":"R2","nombre":"Análisis de riesgos formal","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Análisis de riesgos formal.\nSe deberá realizar un análisis formal, usando un lenguaje específico, con un fundamento matemático reconocido internacionalmente, que:\n– [op.pl.1.r2.1] Valore cualitativamente los activos más valiosos del sistema.\n– [op.pl.1.r2.2] Cuantifique las amenazas posibles.\n– [op.pl.1.r2.3] Valore y priorice las salvaguardas adecuadas.\n– [op.pl.1.r2.4] Valore y asuma formalmente el riesgo residual.","implementacion":"R2 análisis formal exigido en ALTA → cumplido (PILAR, modo formal)."},{"codigo":"op.pl.1","medida":"Análisis de riesgos","refuerzo":"R1","nombre":"Análisis de riesgos semiformal","niveles":"MEDIO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Análisis de riesgos semiformal.\nSe deberá realizar un análisis de riesgos semiformal, usando un lenguaje específico, con un catálogo básico de amenazas y una semántica definida. Es decir, una presentación con tablas que:\n– [op.pl.1.r1.1] Valore cualitativamente los activos más valiosos del sistema.\n– [op.pl.1.r1.2] Cuantifique las amenazas más probables.\n– [op.pl.1.r1.3] Valore las salvaguardas que protegen de dichas amenazas.\n– [op.pl.1.r1.4] Valore el riesgo residual.","implementacion":"—"},{"codigo":"op.pl.2","medida":"Arquitectura de Seguridad","refuerzo":"R1","nombre":"Sistema de gestión","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Sistema de gestión.\n[op.pl.2.r1.1] Sistema de gestión, relativo a la planificación, organización y control de los recursos relativos a la seguridad de la información.","implementacion":"R1+R2+R3 exigidos en ALTA → cumplidos."},{"codigo":"op.pl.2","medida":"Arquitectura de Seguridad","refuerzo":"R2","nombre":"Sistema de gestión de la seguridad con mejora continua","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Sistema de gestión de la seguridad con mejora continua.\n[op.pl.2.r2.1] Sistema de gestión de la seguridad de la información, con actualización y aprobación periódica.","implementacion":"R1+R2+R3 exigidos en ALTA → cumplidos."},{"codigo":"op.pl.2","medida":"Arquitectura de Seguridad","refuerzo":"R3","nombre":"Validación de datos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Validación de datos.\n[op.pl.2.r3.1] Controles técnicos internos, incluyendo la validación de datos de entrada, salida y datos intermedios.","implementacion":"R1+R2+R3 exigidos en ALTA → cumplidos."},{"codigo":"op.pl.4","medida":"Dimensionamiento/gestión de la capacidad","refuerzo":"R1","nombre":"Mejora continua de la gestión de la capacidad","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1 –Mejora continua de la gestión de la capacidad.\n– [op.pl.4.r1.1] Se realizará una previsión de la capacidad y se mantendrá actualizada durante todo el ciclo de vida del sistema.\n– [op.pl.4.r1.2] Se emplearán herramientas y recursos para la monitorización de la capacidad.","implementacion":"Dimensión D = ALTO → R1 exigido → cumplido."},{"codigo":"op.acc.1","medida":"Identificación","refuerzo":"R1","nombre":"Identificación avanzada","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Identificación avanzada.\n– [op.acc.1.r1.1] La identificación del usuario permitirá al Responsable del Sistema, al Responsable de la Seguridad o a sus respectivos administradores delegados, singularizar a la persona asociada al mismo, así como sus responsabilidades en el sistema.\n– [op.acc.1.r1.2] Los datos de identificación serán utilizados por el sistema para determinar los privilegios del usuario conforme a los requisitos de control de acceso establecidos en la documentación de seguridad.\n– [op.acc.1.r1.3] Se asegurará la existencia de una lista actualizada de usuarios autorizados y mantenida por el administrador del sistema/de la seguridad del sistema.","implementacion":"Dimensiones T (MEDIO) y A (ALTO) → nivel ALTO → R1 exigido → cumplido."},{"codigo":"op.acc.2","medida":"Requisitos de acceso","refuerzo":"R1","nombre":"Privilegios de acceso","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Privilegios de acceso.\n– [op.acc.2.r1.1] Todos los usuarios autorizados deben tener un conjunto de atributos de seguridad (privilegios) que puedan ser mantenidos individualmente.\n– [op.acc.2.r1.2] Los privilegios de acceso se implementarán para restringir el tipo de acceso que un usuario puede tener (lectura, escritura, modificación, borrado, etc.).","implementacion":"R1 Privilegios de acceso exigido en ALTO → cumplido."},{"codigo":"op.acc.3","medida":"Segregación de funciones y tareas","refuerzo":"R1","nombre":"Segregación rigurosa","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Segregación rigurosa.\n– [op.acc.3.r1.1] Siempre que sea posible, la misma persona no aunará funciones de configuración y mantenimiento del sistema.\n– [op.acc.3.r1.2] La misma persona no puede aunar funciones de auditoría o supervisión con cualquier otra función.","implementacion":null},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R2","nombre":"Contraseña + OTP","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R2-Contraseña + OTP.\n– [op.acc.5.r2.1] Se requerirá una contraseña de un solo uso (OTP, en inglés) como complemento a la contraseña de usuario.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R3","nombre":"Certificados","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R3-Certificados.\n– [op.acc.5.r3.1] Se emplearán certificados cualificados como mecanismo de autenticación.\n– [op.acc.5.r3.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.\n– [op.acc.5.r3.3] Las credenciales utilizadas deberán haber sido obtenidas tras un registro previo presencial, o bien telemático, usando un certificado electrónico cualificado.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R4","nombre":"Certificados en dispositivo físico","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R4-Certificados en dispositivo físico.\n– [op.acc.5.r4.1] Se emplearán certificados cualificados como mecanismo de autenticación, en soporte físico (tarjeta o similar) usando algoritmos, parámetros y dispositivos autorizados por el CCN.\n– [op.acc.5.r4.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.\n– [op.acc.5.r4.3] Las credenciales utilizadas deberán haber sido obtenidas tras un registro previo presencial, o bien telemático, usando certificado electrónico cualificado.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R5","nombre":"Registro","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R5-Registro.\n– [op.acc.5.r5.1] Se registrarán los accesos con éxito y los fallidos.\n– [op.acc.5.r5.2] Se informará al usuario del último acceso efectuado con su identidad.","implementacion":"Alternativa elegida: R2 (Cl@ve PIN/permanente) y R3/R4 (certificado/DNIe); + R5 registro. Cumple '[R2 o R3 o R4] + R5'."},{"codigo":"op.acc.5","medida":"Mecanismo de autenticación (usuarios externos)","refuerzo":"R1","nombre":"Contraseñas","niveles":"BAJO","nivel_exigido":"ALTO","exigible":"No","texto":"R1-Contraseñas.\n– [op.acc.5.r1.1] Se empleará una contraseña como mecanismo de autenticación.\n– [op.acc.5.r1.2] Se impondrán normas de complejidad mínima y robustez frente a ataques de adivinación (ver guías CCN-STIC).","implementacion":"—"},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R1","nombre":"Contraseñas","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R1-Contraseñas.\n– [op.acc.6.r1.1] Se empleará una contraseña como mecanismo de autenticación cuando el acceso se realiza desde zonas controladas y sin atravesar zonas no controladas (véase refuerzo R8).\n– [op.acc.6.r1.2] Se impondrán normas de complejidad mínima y robustez frente a ataques de adivinación (ver guías CCN-STIC).","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R2","nombre":"Contraseña + otro factor de autenticación","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R2-Contraseña + otro factor de autenticación.\n– [op.acc.6.r2.1] Se requerirá un segundo factor tal como «algo que se tiene», es decir, un dispositivo, una contraseña de un solo uso (OTP, en inglés) como complemento a la contraseña de usuario, o «algo que se es».","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R3","nombre":"Certificados","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R3-Certificados.\n– [op.acc.6.r3.1] Se emplearán certificados cualificados como mecanismo de autenticación.\n– [op.acc.6.r3.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R4","nombre":"Certificados en dispositivo físico","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Alternativa (elegir ≥1 del grupo)","texto":"R4-Certificados en dispositivo físico.\n– [op.acc.6.r4.1] Se emplearán certificados cualificados como mecanismo de autenticación, en soporte físico (tarjeta o similar) usando algoritmos, parámetros y dispositivos autorizados por el CCN.\n– [op.acc.6.r4.2] El uso del certificado estará protegido por un segundo factor, del tipo PIN o biométrico.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R5","nombre":"Registro","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R5-Registro.\n– [op.acc.6.r5.1] Se registrarán los accesos con éxito y los fallidos.\n– [op.acc.6.r5.2] Se informará al usuario del último acceso efectuado con su identidad.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R6","nombre":"Limitación de la ventana de acceso","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R6-Limitación de la ventana de acceso.\n– [op.acc.6.r6.1] Se definirán aquellos puntos en los que el sistema requerirá una renovación de la autenticación del usuario, mediante identificación singular, no bastando con la sesión establecida.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R7","nombre":"Suspensión por no utilización","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R7-Suspensión por no utilización.\n– [op.acc.6.r7.1] Las credenciales se suspenderán tras un periodo definido de no utilización.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R8","nombre":"Doble factor para acceso desde o a través de zonas no controladas","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R8-Doble factor para acceso desde o a través de zonas no controladas.\nSe denomina «zona controlada» aquella que no es de acceso público, requiriéndose que el usuario, antes de tener acceso al equipo, se haya autenticado previamente de alguna forma (control de acceso a las instalaciones), diferente del mecanismo de autenticación lógica frente al sistema. Un ejemplo de zona no controlada es Internet.\n– [op.acc.6.r8.1] Para el acceso desde o a través de zonas no controladas se requerirá un doble factor de autenticación: R2, R3 o R4.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.acc.6","medida":"Mecanismo de autenticación (usuarios de la organización)","refuerzo":"R9","nombre":"Acceso remoto (todos los niveles)","niveles":"BAJO/MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R9-Acceso remoto (todos los niveles).\n– [op.acc.6.r9.1] Será de aplicación la ITS de Interconexión de sistemas de información.\n– [op.acc.6.r9.2] El acceso remoto deberá considerar los siguientes aspectos:\na) Ser autorizado por la autoridad correspondiente.\nb) El tráfico deberá ser cifrado.\nc) Si la utilización no se produce de manera constante, el acceso remoto deberá encontrarse inhabilitado y habilitarse únicamente cuando sea necesario.\nd) Deberán recogerse registros de auditoría de este tipo de conexiones.","implementacion":"Alternativa elegida: R2 para todo el personal y R4 para administradores. Cumple '[R1 o R2 o R3 o R4] + R5 + R6 + R7 + R8 + R9'."},{"codigo":"op.exp.3","medida":"Gestión de la configuración de seguridad","refuerzo":"R1","nombre":"Mantenimiento regular de la configuración","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Mantenimiento regular de la configuración.\n– [op.exp.3.r1.1] Existirán configuraciones hardware/software, autorizadas y mantenidas regularmente, para los servidores, elementos de red y estaciones de trabajo.\n– [op.exp.3.r1.2] Se verificará periódicamente la configuración hardware/software del sistema para asegurar que no se han introducido ni instalado elementos no autorizados.\n– [op.exp.3.r1.3] Se mantendrá una lista de servicios autorizados para servidores y estaciones de trabajo.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.3","medida":"Gestión de la configuración de seguridad","refuerzo":"R2","nombre":"Responsabilidad de la configuración","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Responsabilidad de la configuración.\n– [op.exp.3.r2.1] La configuración de seguridad del sistema operativo y aplicaciones, tanto de estaciones y servidores como de la electrónica de red del sistema, será responsabilidad de un número muy limitado de administradores del sistema.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.3","medida":"Gestión de la configuración de seguridad","refuerzo":"R3","nombre":"Copias de seguridad","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Copias de seguridad.\n– [op.exp.3.r3.1] Se realizarán copias de seguridad de la configuración del sistema de forma que sea posible reconstruirlo en parte o en su totalidad tras un incidente.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.4","medida":"Mantenimiento y actualizaciones de seguridad","refuerzo":"R1","nombre":"Pruebas en preproducción","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Pruebas en preproducción.\n[op.exp.4.r1.1] Antes de poner en producción una nueva versión o una versión parcheada, se comprobará en un entorno de prueba controlado y consistente en configuración al entorno de producción, que la nueva instalación funciona correctamente y no disminuye la eficacia de las funciones necesarias para el trabajo diario.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.exp.4","medida":"Mantenimiento y actualizaciones de seguridad","refuerzo":"R2","nombre":"Prevención de fallos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Prevención de fallos.\n[op.exp.4.r2.1] Antes de la aplicación de las configuraciones, parches y actualizaciones de seguridad se preverá un mecanismo para revertirlos en caso de aparición de efectos adversos.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.exp.5","medida":"Gestión de cambios","refuerzo":"R1","nombre":"Prevención de fallos","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Prevención de fallos.\n– [op.exp.5.r1.1] Antes de la aplicación de los cambios, se deberá tener en cuenta la posibilidad de revertirlos en caso de la aparición de efectos adversos.\n– [op.exp.5.r1.2] Todos los fallos en el software y hardware deberán ser comunicados al responsable designado en la organización de la seguridad.\n– [op.exp.5.r1.3] Todos los cambios en el sistema deberán documentarse, incluyendo una valoración del impacto que dicho cambio supone en la seguridad del sistema.","implementacion":null},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R1","nombre":"Escaneo periódico","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Escaneo periódico.\n– [op.exp.6.r1.1] Todo el sistema se escaneará regularmente para detectar código dañino.","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R2","nombre":"Revisión preventiva del sistema","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Revisión preventiva del sistema.\n– [op.exp.6.r2.1] Las funciones críticas se analizarán al arrancar el sistema en prevención de modificaciones no autorizadas.","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R3","nombre":"Lista blanca","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3 - Lista blanca.\n– [op.exp.6.r3.1] Solamente se podrán ejecutar aquellas aplicaciones previamente autorizadas. Se implementará una lista blanca para impedir la ejecución de aplicaciones no autorizadas.","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.6","medida":"Protección frente a código dañino","refuerzo":"R4","nombre":"Capacidad de respuesta en caso de incidente","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R4-Capacidad de respuesta en caso de incidente.\n– [op.exp.6.r4.1] Se emplearán herramientas de seguridad orientadas a detectar, investigar y resolver actividades sospechosas en puestos de usuario y servidores (EDR - Endpoint Detection and Response).","implementacion":"R1+R2+R3+R4 exigidos → cumplidos."},{"codigo":"op.exp.7","medida":"Gestión de incidentes","refuerzo":"R1","nombre":"Notificación","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Notificación.\n– [op.exp.7.r1.1] Se dispondrá de soluciones de ventanilla única para la notificación de incidentes al CCN-CERT, que permita la distribución de notificaciones a las diferentes entidades de manera federada, utilizando para ello dependencias administrativas jerárquicas.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.7","medida":"Gestión de incidentes","refuerzo":"R2","nombre":"Detección y Respuesta","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2 –Detección y Respuesta.\nEl proceso integral para hacer frente a los incidentes que puedan tener un impacto en la seguridad del sistema ([op.exp.7.1]) deberá incluir:\n– [op.exp.7.r2.1] Implantación de medidas urgentes, incluyendo la detención de servicios, el aislamiento del sistema afectado, la recogida de evidencias y protección de los registros, según convenga al caso.\n– [op.exp.7.r2.2] Asignación de recursos para investigar las causas, analizar las consecuencias y resolver el incidente.\n– [op.exp.7.r2.3] Informar del incidente a los responsables de la información y servicios afectados y de las actuaciones llevadas a cabo para su resolución.\n– [op.exp.7.r2.4] Medidas para:\na) Prevenir que se repita el incidente.\nb) Incluir en los procedimientos de usuario la identificación y forma de tratar el incidente.\nc) Actualizar, extender, mejorar u optimizar los procedimientos de resolución de incidentes.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.7","medida":"Gestión de incidentes","refuerzo":"R3","nombre":"Reconfiguración dinámica","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R3-Reconfiguración dinámica.\nLa reconfiguración dinámica del sistema persigue detener, desviar o limitar ataques, acotando los daños.\n– [op.exp.7.r3.1] La reconfiguración dinámica incluye, por ejemplo, cambios en las reglas de los enrutadores (routers), listas de control de acceso, parámetros del sistema de detección / prevención de intrusiones y reglas en los cortafuegos y puertas de enlace, aislamiento de elementos críticos y aislamiento de las copias de seguridad.\n– [op.exp.7.r3.2] El organismo adaptará los procedimientos de reconfiguración dinámica reaccionando a los anuncios recibidos del CCN-CERT relativos a ciberamenazas sofisticadas y campañas de ataques.","implementacion":"R1+R2+R3 exigidos → cumplidos."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R1","nombre":"Revisión de los registros","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R1-Revisión de los registros.\n– [op.exp.8.r1.1] Se revisarán informalmente, de forma periódica, los registros de actividad, buscando patrones anormales.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R2","nombre":"Sincronización del reloj del sistema","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R2-Sincronización del reloj del sistema.\n– [op.exp.8.r2.1] El sistema deberá disponer de una referencia de tiempo (timestamp) para facilitar las funciones de registro de eventos y auditoría. La modificación de la referencia de tiempo del sistema será una función de administración y, en caso de realizarse su sincronización con otros dispositivos, deberán utilizarse mecanismos de autenticación e integridad.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R3","nombre":"Retención de registros","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R3-Retención de registros.\n– [op.exp.8.r3.1] En la documentación de seguridad del sistema se deberán indicar los eventos de seguridad que serán auditados y el tiempo de retención de los registros antes de ser eliminados.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R4","nombre":"Control de acceso","niveles":"MEDIO/ALTO","nivel_exigido":"MEDIO","exigible":"Sí","texto":"R4-Control de acceso.\n– [op.exp.8.r4.1] Los registros de actividad y, en su caso, las copias de seguridad de los mismos, solamente podrán ser accedidos o eliminarse por personal debidamente autorizado.","implementacion":"Dimensión T = MEDIO → exigidos R1-R4; R5 (revisión automática y correlación) no exigido pero implantado voluntariamente (exceso de cumplimiento)."},{"codigo":"op.exp.8","medida":"Registro de la actividad","refuerzo":"R5","nombre":"Revisión automática y correlación de eventos","niveles":"ALTO","nivel_exigido":"MEDIO","exigible":"No","texto":"R5-Revisión automática y correlación de eventos.\n– [op.exp.8.r5.1] El sistema deberá implementar herramientas para analizar y revisar la actividad del sistema y la información de auditoría, en búsqueda de comprometimientos de la seguridad posibles o reales.\n– [op.exp.8.r5.2] Se dispondrá de un sistema automático de recolección de registros, correlación de eventos y respuesta automática ante los mismos.","implementacion":"—"},{"codigo":"op.exp.10","medida":"Protección de claves criptográficas","refuerzo":"R1","nombre":"Algoritmos autorizados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Algoritmos autorizados.\n– [op.exp.10.r1.1] Se emplearán algoritmos y parámetros autorizados por el CCN.","implementacion":"R1 exigido → cumplido."},{"codigo":"op.ext.4","medida":"Interconexión de sistemas","refuerzo":"R1","nombre":"Coordinación de actividades","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Coordinación de actividades.\n– [op.ext.4.r1.1] Cuando se interconecten sistemas en los que la identificación, autenticación y autorización tengan lugar en diferentes dominios de seguridad, bajo distintas responsabilidades, las medidas de seguridad locales se acompañarán de los correspondientes mecanismos y procedimientos de coordinación para la atribución y ejercicio efectivos de las responsabilidades de cada sistema.","implementacion":"R1 exigido → cumplido."},{"codigo":"op.nub.1","medida":"Protección de servicios en la nube","refuerzo":"R1","nombre":"Servicios certificados","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1- Servicios certificados.\n– [op.nub.1.r1.1] Cuando se utilicen servicios en la nube suministrados por terceros, estos deberán estar certificados bajo una metodología de certificación reconocida por el Organismo de Certificación del Esquema Nacional de Evaluación y Certificación de Seguridad de las Tecnologías de la Información.\n– [op.nub.1.r1.2] Si el servicio en la nube es un servicio de seguridad deberá cumplir con los requisitos establecidos en [op.pl.5].","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.nub.1","medida":"Protección de servicios en la nube","refuerzo":"R2","nombre":"Guías de Configuración de Seguridad Específicas","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Guías de Configuración de Seguridad Específicas.\n– [op.nub.1.r2.1] La configuración de seguridad de los sistemas que proporcionan estos servicios deberá realizarse según la correspondiente guía CCN-STIC de Configuración de Seguridad Específica, orientadas tanto al usuario como al proveedor.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.1","medida":"Detección de intrusión","refuerzo":"R1","nombre":"Detección basada en reglas","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Detección basada en reglas.\n– [op.mon.1.r1.1] El sistema dispondrá de herramientas de detección o prevención de intrusiones basadas en reglas.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.1","medida":"Detección de intrusión","refuerzo":"R2","nombre":"Procedimientos de respuesta","niveles":"ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Procedimientos de respuesta.\n– [op.mon.1.r2.1] Existirán procedimientos de respuesta a las alertas generadas por el sistema de detección o prevención de intrusiones.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.2","medida":"Sistema de métricas","refuerzo":"R1","nombre":"Efectividad del sistema de gestión de incidentes","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Efectividad del sistema de gestión de incidentes.\n– [op.mon.2.r1.1] Se recopilarán los datos precisos que posibiliten evaluar el comportamiento del sistema de gestión de incidentes, de acuerdo con la Instrucción Técnica de Seguridad de Notificación de Incidentes de Seguridad y con la correspondiente guía CCN-STIC.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.2","medida":"Sistema de métricas","refuerzo":"R2","nombre":"Eficiencia del sistema de gestión de la seguridad","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R2-Eficiencia del sistema de gestión de la seguridad.\n– [op.mon.2.r2.1] Se recopilarán los datos precisos para conocer la eficiencia del sistema de seguridad, en relación con los recursos consumidos, en términos de horas y presupuesto.","implementacion":"R1+R2 exigidos → cumplidos."},{"codigo":"op.mon.3","medida":"Vigilancia","refuerzo":"R1","nombre":"Correlación de eventos","niveles":"MEDIO/ALTO","nivel_exigido":"ALTO","exigible":"Sí","texto":"R1-Correlación de eventos.\n– [op.mon.3.r1.1] Se dispondrá de un sistema automático de recolección de eventos de seguridad que permita la correlación de los mismos.","i
